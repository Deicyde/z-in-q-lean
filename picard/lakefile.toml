name = "z_over_q_picard"
version = "0.1.0"
defaultTargets = ["PicardApplications"]

[[require]]
name = "z_in_q_kernel"
git = "https://github.com/elliotglazer/diophantine-z-q.git"
rev = "2358394558aafae202a1ce6d3bd1b536b79ad3d0"

[[lean_lib]]
name = "QualitativeDependencies"
srcDir = "../bounded"
roots = ["TYZFactorizations", "TYZIntegerCoefficient", "TYZUnordered", "TYZMultisetWeights", "TYZBracket", "TwistLFunction", "PublishedGenusRows", "BoundedFromGenus", "FinitePolynomial", "QualitativeMultiplication", "QualitativePrecision", "IntegerPolynomial", "QualitativeHeight", "ModuliHeight", "PicardSextic", "PicardCriterion", "EndomorphismSpecialization", "HenselTriples", "PicardLocal", "PicardConjugation"]

[[lean_lib]]
name = "ThetaQuotient"
srcDir = "../Lean/Lemmas/theta-quotient"

[[lean_lib]]
name = "AbelianModel"
srcDir = "../Lean/Lemmas/marked-rm-descent/good-reduction"

[[lean_lib]]
name = "DescentDependencies"
srcDir = "../Lean/Lemmas/marked-rm-descent"
roots = ["NormalDescent", "RationalEndomorphism", "GroupEndomorphism", "QuadraticAction"]

[[lean_lib]]
name = "PicardApplications"
roots = ["PicardDiscriminant", "PrimitiveTwist", "LocalSupport", "PrymFactor", "ThetaComparison", "UniformDescent", "FibrewiseProjector", "PicardAssembly", "AbelianPowers", "GuitartDescent", "QuaternionField"]
