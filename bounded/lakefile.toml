name = "z_over_q_bounded"
version = "0.1.0"
defaultTargets = ["BoundedFromGenus", "QualitativeExistence"]

[[require]]
name = "z_in_q_kernel"
git = "https://github.com/elliotglazer/diophantine-z-q.git"
rev = "2358394558aafae202a1ce6d3bd1b536b79ad3d0"

[[lean_lib]]
name = "BoundedFromGenus"
roots = ["TYZFactorizations", "TYZIntegerCoefficient", "TYZUnordered", "TYZMultisetWeights", "TYZBracket", "TwistLFunction", "PublishedGenusRows", "BoundedFromGenus"]

[[lean_lib]]
name = "QualitativeExistence"
roots = [
  "FinitePolynomial", "QualitativeMultiplication", "QualitativePrecision", "IntegerPolynomial",
  "QualitativeHeight", "ModuliHeight", "PicardSextic", "PicardCriterion",
  "EndomorphismSpecialization", "HenselTriples", "PicardLocal", "PicardConjugation"
]
