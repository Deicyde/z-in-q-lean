omial.lean#L54-L78","code":"theorem conj {ι : Type} {R S : (ι → ℚ) → Prop}\n    (hr : PolynomialRelation R) (hs : PolynomialRelation S) :\n    PolynomialRelation (fun a => R a ∧ S a)","papers":[],"uses":[29],"later":[32],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/polynomial.md#s-30"},{"key":"project","n":31,"title":"Projection with one distinguished coordinate","kind":"Lemma","chapter":2,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/bounded/FinitePolynomial.lean#L82-L106","code":"theorem project {κ : Type} [Finite κ] {R : (Unit ⊕ κ → ℚ) → Prop} (h : PolynomialRelation R) :\n    ∃ n : ℕ, ∃ p : MvPolynomial (Fin (n + 1)) ℤ, ∀ q : ℚ,\n      (∃ w : Fin n → ℚ, eval₂ (Int.castRingHom ℚ) (Fin.cons q w) p = 0) ↔\n        ∃ u : κ → ℚ, R (Sum.elim (fun _ => q) u)","papers":[],"uses":[29],"later":[34],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/polynomial.md#s-31"},{"key":"joint","n":32,"title":"A polynomial for the three simultaneous tests","kind":"Lemma","chapter":2,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/bounded/IntegerPolynomial.lean#L48-L63","code":"private theorem joint_polynomial (T : ℤ) (m : ℕ) : PolynomialRelation (Joint T m)","papers":[],"uses":[30],"later":[34],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/polynomial.md#s-32"},{"key":"off","n":33,"title":"The image away from the six constants","kind":"Lemma","chapter":2,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/bounded/IntegerPolynomial.lean#L68-L80","code":"private theorem off_contacts {m : ℕ} (hm : 1 ≤ m) (hH : UniformHeight (m : ℝ))\n    (hP : PoleCompleteness) (q : ℚ) :\n    (∃ u : Codes → ℚ, Joint (guardCutoff m) m (Sum.elim (fun _ => q) u)) ↔\n      ∃ z : ℤ, (z : ℚ) = q ∧ q ∉ contactSet","papers":[],"uses":[28,22],"later":[34],"read":"https://github.com/ :"The actual Jacobian and its conjugates","kind":"Proposition","chapter":3,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardDescent.lean#L558-L568","code":"theorem family_galois_pullback (t d : ℚ) (ht : t ∉ contactSet) (hd : d ≠ 0)\n    (σ : fixedField ≃ₐ[ℚ] fixedField) :\n    let J := familyJacobian t d ht hd (AlgEquiv.refl : fixedField ≃ₐ[ℚ] fixedField)\n    Nonempty ((ZInQBlueprint.AbelianModel.baseChange σ.toRingHom).obj J ≅ J)","papers":[],"uses":[37],"later":[53],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/picard.md#s-41"},{"key":"qm","n":42,"title":"The full quaternionic endomorphism algebra","kind":"Definition","chapter":3,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/QuaternionModel.lean#L12-L23","code":"structure QuaternionModel {L : FiniteGaloisIntermediateField ℚ Qbar} (Y : GroupScheme L) where\n  D : Type\n  [division : DivisionRing D]\n  [rationalAlgebra : Algebra ℚ D]\n  presentation : D ≃ₐ[ℚ] QEnd Y\n  i : D\n  j : D\n  sq_i : i*i = algebraMap ℚ D (-3)\n  sq_j : j*j = algebraMap ℚ D 2\n  skew : j*i = -(i*j)\n  generates : Algebra.adjoin ℚ ({i,j} : Set D) = ⊤\n  geometric_surjective : Function.Surjective (change L.toIntermediateField.val.toRingHom Y)","papers":[],"uses":[],"later":[48,53,57,60],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/picard.md#s-42"},{"key":"split","n":43,"title":"The exceptional marked values","kind":"Definition","chapter":3,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardCM.lean#L242-L243","code":"def splitValues : Set Qbar := {j | ∃ (dg : (canonicalPolynomial j).natDegree = 6)\n    (sg : (canonicalPolynomial j).Separable), HasEllipticSubgroup (completionJacobian _ dg sg)}","papers":[],"uses":[],"later":[44],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/picard.md#s-43"},{"key":"cm","n":44,"title":"Finiteness in degree at most two","kind":"Hypothesis","chapter":3,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardConclusion.lean#L24-L25","code":"def FiniteSplitValues : Prop :=\n  {j : Qbar | j ∈ PicardCM.splitValues ∧ Module.finrank ℚ ℚ⟮j⟯ ≤ 2}.Finite","papers":[["Laga–Shnidman, Remark 2.12 and Lemmas 6.2, 6.16","https://doi.org/10.1112/jlms.70347"]],"uses":[43],"later":[46],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/picard.md#s-44"},{"key":"pullback","n":45,"title":"At most six preimages per marked value","kind":"Lemma","chapter":3,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardCM.lean#L72-L112","code":"theorem finite_pullback (f : ℚ → ℚ) (inj : Function.Injective f) (values : Finset Qbar) :\n    ∃ T : Finset ℚ, T.card ≤ 6*values.card ∧ ∀ t, t∈T ↔ markedValue (f t) ∈ values","papers":[],"uses":[],"later":[46],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/picard.md#s-45"},{"key":"exceptions","n":46,"title":"One exceptional set for all twists","kind":"Proposition","chapter":3,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardCM.lean#L249-L259","code":"theorem nonsimple_fibres\n    (finite : {j : Qbar | j ∈ splitValues ∧ Module.finrank ℚ ℚ⟮j⟯ ≤ 2}.Finite) :\n    ∃ T : Finset ℚ, T.card ≤ 6*finite.toFinset.card ∧\n      ∀ (t d : ℚ) (ht : t ∉ contactSet) (hd : d ≠ 0),\n        t ∈ T ↔ HasEllipticSubgroup (geometricFibre t d ht hd)","papers":[],"uses":[44,45,37],"later":[51],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/picard.md#s-46"},{"key":"rr","n":47,"title":"The coordinate identity in the Prym construction","kind":"Lemma","chapter":3,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PrymCoordinates.lean#L61-L68","code":"theorem sextic_substitution [CharZero K] (a w : K) (ha : a ≠ 0) (hw : w ≠ 0) :\n    (rrPolynomial a w).comp (C w*X) = C ((w^2/a)^2)*publishedPolynomial a w","papers":[["Ritzenthaler–Romagny, Theorem 1.1","https://doi.org/10.46298/epiga.2018.volume2.3663"],["Laga–Shnidman, Remark 2.12","https://doi.org/10.1112/jlms.70347"]],"uses":[],"later":[48],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/picard.md#s-47"},{"key":"prym","n":48,"title":"Endomorphisms of the published Prym sextic","kind":"Hypothesis","chapter":3,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardPrym.lean#L98-L104","code":"def PublishedPrymEndomorphisms : Prop :=\n  ∀ (L : FiniteGaloisIntermediateField ℚ Qbar) (a w : L), a ≠ 0 → w ≠ 0 → a^2-4*w^3 ≠ 0 →\n    (∃ o : L, o^2+o+1=0) → (∃ ε : L, ε^6=16*w^3*(a^2-4*w^3)) →\n    ∀ (deg : (publishedPolynomial a w).natDegree = 6) (sep : (publishedPolynomial a w).Separable)\n      (Y : GroupScheme L), Nonempty (Y ≅ completionJacobian _ deg sep) →\n      ¬HasEllipticSubgroup ((baseChange L.toIntermediateField.val.toRingHom).obj Y) →\n      Nonempty (QuaternionModel Y)","papers":[["Laga–Shnidman, Remark 2.12, Lemma 6.2, Theorem 6.5 and Corollary 6.6","https://doi.org/10.1112/jlms.70347"],["Ritzenthaler–Romagny, Theorem 1.1","https://doi.org/10.46298/epiga.2018.volume2.3663"]],"uses":[42,47],"later":[51],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/picard.md#s-48"},{"key":"equality","n":49,"title":"The normalized polynomial of the twist","kind":"Lemma","chapter":3,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardPrym.lean#L58-L64","code":"theorem twisted_polynomial {u v d : K} (hv : v ≠ 0) (hΔ : u^6-v^6 ≠ 0) (hd : d ≠ 0) :\n    let l := v^2/d\n    publishedPolynomial (l^3*Prym.a u v) (l^2*Prym.cubeRoot u v) =\n      sextic (u^6/(2*d)) (v^6/(2*d))","papers":[],"uses":[],"later":[51],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/picard.md#s-49"},{"key":"sixth","n":50,"title":"Marking and sixth root over one field","kind":"Lemma","chapter":3,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardPrym.lean#L68-L91","code":"theorem twisted_parameters {u v d i : K} (hu : u ≠ 0) (hv : v ≠ 0)\n    (hΔ : u^6-v^6 ≠ 0) (hd : d ≠ 0) (hi : i^2 = -1) :\n    let l := v^2/d\n    let a := l^3*Prym.a u v\n    let w := l^2*Prym.cubeRoot u v\n    a ≠ 0 ∧ w ≠ 0 ∧ a^2-4*w^3 ≠ 0 ∧\n      1-a^2/(4*w^3)=u^6/v^6 ∧ (l^2*(2*i*(u^6-v^6)*u*v))^6=16*w^3*(a^2-4*w^3)","papers":[],"uses":[],"later":[51],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/picard.md#s-50"},{"key":"qmfamily","n":51,"title":"Quaternion multiplication on every ordinary twist","kind":"Proposition","chapter":3,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardPrym.lean#L200-L207","code":"theorem quaternion_outside_finite (published : PublishedPrymEndomorphisms)\n    (finite : {j : Qbar | j ∈ splitValues ∧ Module.finrank ℚ ℚ⟮j⟯ ≤ 2}.Finite) :\n    ∃ T : Finset ℚ, T.card ≤ 6*finite.toFinset.card ∧\n      ∀ (t d : ℚ) (ht : t ∉ contactSet) (hd : d ≠ 0), t ∉ T →\n      Nonempty (QuaternionModel (familyOver (IntermediateField.inclusion fixed_le) t d ht hd))","papers":[],"uses":[37,46,48,49,50],"later":[69],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/picard.md#s-51"},{"key":"multi","n":52,"title":"Multiplication by a nonzero integer","kind":"Hypothesis","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/GuitartSurfaces.lean#L23-L26","code":"def MultiplicationTheorem : Prop :=\n  ∀ (K : Type) [Field K] [CharZero K] (A : GroupScheme K), IsAbelianScheme A →\n    ∀ z : ℤ, z ≠ 0 → let f := (z • 𝟙 A).hom.hom.hom.left\n      IsFinite f ∧ Flat f ∧ AlgebraicGeometry.Surjective f","papers":[["Milne, Abelian Varieties, Theorem 8.2","https://www.jmilne.org/math/xnotes/AVs.pdf#page=13"]],"uses":[],"later":[54,55,61,65],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-52"},{"key":"quasi","n":53,"title":"A quasi-isogeny intertwining the endomorphisms","kind":"Lemma","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardConjugateEnd.lean#L175-L207","code":"theorem family_quasi_isogeny {L D : Type} [Field L] [CharZero L] [DivisionRing D] [Algebra ℚ D]\n    (ψ : fixedField →ₐ[ℚ] L) (t d : ℚ) (ht : t ∉ contactSet) (hd : d ≠ 0)\n    (str : D ≃ₐ[ℚ] QEnd (familyOver ψ t d ht hd))\n    (i j : D) (hi : i*i = algebraMap ℚ D (-3)) (hj : j*j = algebraMap ℚ D 2)\n    (skew : j*i = -(i*j)) (gen : Algebra.adjoin ℚ ({i,j} : Set D) = ⊤) (σ : L ≃ₐ[ℚ] L) :\n    let Y := familyOver ψ t d ht hd\n    let X := (baseChange σ.toRingHom).obj Y\n    ∃ (μ : QHom X Y) (ν : QHom Y X),\n      comp μ ν = (1:ℚ) ⊗ₜ[ℤ] 𝟙 X ∧ comp ν μ = (1:ℚ) ⊗ₜ[ℤ] 𝟙 Y ∧\n      ∀ z : QEnd Y, comp (asHom X (change σ.toRingHom Y z)) μ = comp μ (asHom Y z)","papers":[],"uses":[41,42],"later":[55],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-53"},{"key":"clear","n":54,"title":"Clearing denominators in a quasi-isogeny","kind":"Lemma","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardIntegralHom.lean#L66-L84","code":"theorem isogeny_of_quasi {K : Type} [Field K] {A B : GroupScheme K}\n    (μ : QHom A B) (ν : QHom B A) (hm : comp μ ν = integral A A (𝟙 A))\n    (hn : comp ν μ = integral B B (𝟙 B)) (sep : IsSeparated B.X.hom)\n    (finite : ∀ n : ℤ, n ≠ 0 → IsFinite (underlying (n • 𝟙 A)))\n    (surj : ∀ n : ℤ, n ≠ 0 → Surjective (underlying (n • 𝟙 B))) :\n    ∃ (f : A ⟶ B) (k : ℤ), k ≠ 0 ∧ IsFinite (underlying f) ∧ Surjective (underlying f) ∧\n      integral A B f = k • μ","papers":[],"uses":[52],"later":[55],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-54"},{"key":"compatible","n":55,"title":"Integral compatible isogenies","kind":"Lemma","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/GuitartSurfaces.lean#L37-L49","code":"theorem compatible_isogenies {K : Type} [Field K] [CharZero K] (Y : GroupScheme K)\n    (ab : IsAbelianScheme Y) (multi : MultiplicationTheorem) (maps : ∃ μ : Maps Y, Compatible Y μ) :\n    CompatibleIsogenies Y","papers":[],"uses":[53,54,52],"later":[61],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-55"},{"key":"mullaw","n":56,"title":"The multiplication law on a finite Galois quotient","kind":"Definition","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/GuitartCocycle.lean#L38-L42","code":"def Multiplier (J : GroupScheme L) (μ : Maps J) (c : Gal(L/ℚ) × Gal(L/ℚ) → ℚˣ) : Prop :=\n  ∀ σ τ, let i : pull (σ*τ) J ≅ pull σ (pull τ J) :=\n      WittAscent.baseChangeCompIso τ.toRingHom σ.toRingHom J\n    comp ((1:ℚ) ⊗ₜ[ℤ] i.hom) (comp (changeHom σ.toRingHom (μ τ)) (μ σ)) =\n      (↑(c (σ,τ)) : ℚ) • μ (σ*τ)","papers":[],"uses":[],"later":[57,60],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-56"},{"key":"multiplier","n":57,"title":"The rational central cocycle","kind":"Hypothesis","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/GuitartSurfaces.lean#L60-L66","code":"def RationalMultipliers : Prop :=\n  ∀ (L : FiniteGaloisIntermediateField ℚ PicardConjugation.Qbar) (Y : GroupScheme L),\n    IsAbelianScheme Y → SmoothOfRelativeDimension 2 Y.X.hom →\n    PicardPrym.QuaternionModel Y → CompatibleIsogenies Y →\n    ∃ (μ : Maps Y) (c : Gal(L/ℚ) × Gal(L/ℚ) → ℚˣ),\n      Compatible Y μ ∧ IntegralMaps μ ∧ Multiplier Y μ c ∧ c (1,1) = 1 ∧\n      ∀ g h j, c (g*h,j)*c (g,h) = c (h,j)*c (g,h*j)","papers":[["Guitart, Definition 2.1 and p. 594","https://ems.press/content/serial-article-files/38384?nt=1#page=4"]],"uses":[56,42],"later":[61],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-57"},{"key":"geomlaw","n":58,"title":"The descent formula on the fixing subgroup","kind":"Definition","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/GuitartFormula.lean#L18-L23","code":"def GeometricLaw {A B : GroupScheme M}\n    (b : Gal(M/ℚ) → Qbarˣ)\n    (φ : coefficientField b →ₐ[ℚ] (ℚ ⊗[ℤ] End ((F).obj A)))\n    (κ : (F).obj A ⟶ (F).obj B) : Prop :=\n  ∀ σ : Gal(Qbar/M), (1:ℚ) ⊗ₜ[ℤ] (conjugate κ σ) = afterHom κ\n    (φ (↑((coefficientUnit b (restriction M (σ.restrictScalars ℚ)))⁻¹) : coefficientField b))","papers":[],"uses":[],"later":[59,65],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-58"},{"key":"gdata","n":59,"title":"Data accompanying the geometric isogeny","kind":"Definition","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/GuitartApplication.lean#L55-L74","code":"structure GeometricIsogenyData (M : FiniteGaloisIntermediateField ℚ (AlgebraicClosure ℚ))\n    (J A : GroupScheme M)\n    (b : Gal(M/ℚ) → (AlgebraicClosure ℚ)ˣ) where\n  B : GroupScheme ℚ\n  abelian : IsAbelianScheme B\n  dimension : SmoothOfRelativeDimension (2 * Module.finrank ℚ (coefficientField b)) B.X.hom\n  endomorphisms :\n    (coefficientField b ⊗[ℚ] (ℚ ⊗[ℤ] End ((geometric M).obj J))) ≃ₐ[ℚ] (ℚ ⊗[ℤ] End B)\n  nontrivial : Nontrivial (ℚ ⊗[ℤ] End ((geometric M).obj J))\n  i : ℚ ⊗[ℤ] End ((geometric M).obj J)\n  j : ℚ ⊗[ℤ] End ((geometric M).obj J)\n  sq_i : i^2 = -3\n  sq_j : j^2 = 2\n  skew : j*i = -(i*j)\n  representation : coefficientField b →ₐ[ℚ] (ℚ ⊗[ℤ] End ((geometric M).obj A))\n  κ : (geometric M).obj A ⟶\n    (geometric M).obj ((baseChange (algebraMap ℚ M)).obj B)\n  finite : IsFinite κ.hom.hom.hom.left\n  onto : AlgebraicGeometry.Surjective κ.hom.hom.hom.left\n  splitting : GeometricLaw M (A:=A) (B:=(baseChange (algebraMap ℚ M)).obj B) b representation κ","papers":[],"uses":[58],"later":[60,66],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-59"},{"key":"guitart","n":60,"title":"Guitart's descent theorem in the chosen models","kind":"Hypothesis","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/GuitartSurfaces.lean#L73-L82","code":"def GeometricDescent : Prop :=\n  ∀ (k : Type) [Field k] [NumberField k] (L : FiniteGaloisIntermediateField ℚ PicardConjugation.Qbar)\n    (ψ : k →ₐ[ℚ] L) (X : GroupScheme k), let Y := (baseChange ψ.toRingHom).obj X\n    IsAbelianScheme Y → SmoothOfRelativeDimension 2 Y.X.hom → PicardPrym.QuaternionModel Y →\n    ∀ (μ : Maps Y) (c : Gal(L/ℚ) × Gal(L/ℚ) → ℚˣ),\n      Compatible Y μ → IntegralMaps μ → Multiplier Y μ c → c (1,1) = 1 →\n      ∀ (M : FiniteGaloisIntermediateField ℚ PicardConjugation.Qbar) (le : L ≤ M) (b : Gal(M/ℚ) → PicardConjugation.Qbarˣ),\n        (∀ g h, rationalUnit (c (finiteRestriction le g, finiteRestriction le h)) = b g * b h / b (g*h)) →\n        let Z := (baseChange ((IntermediateField.inclusion le).comp ψ).toRingHom).obj X\n        Nonempty (GeometricIsogenyData M Z (AbelianPowers.power Z (Module.finrank ℚ (coefficientField b)-1)) b)","papers":[["Guitart, Proposition 2.10 and Corollary 2.12","https://ems.press/content/serial-article-files/38384?nt=1#page=7"]],"uses":[59,56,42],"later":[61],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-60"},{"key":"systems","n":61,"title":"A descent system on each quaternionic surface","kind":"Proposition","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/GuitartSurfaces.lean#L100-L113","code":"theorem systems_of_endomorphisms (multi : MultiplicationTheorem) (multipliers : RationalMultipliers) (descent : GeometricDescent)\n    (L : FiniteGaloisIntermediateField ℚ PicardConjugation.Qbar) (ψ : fixedField →ₐ[ℚ] L) (except : Finset ℚ)\n    (dim : ∀ (t : ℚ) (ht : t ∉ contactSet), SmoothOfRelativeDimension 2 (surface L ψ t ht).X.hom)\n    (ends : ∀ (t : ℚ) (ht : t ∉ contactSet), picardParameter t ∉ except →\n      Nonempty (PicardPrym.QuaternionModel (surface L ψ t ht))) : GeometricSystems L ψ except","papers":[],"uses":[52,55,57,60,40],"later":[67,69],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-61"},{"key":"tate","n":62,"title":"Tate's splitting theorem for discrete coefficients","kind":"Hypothesis","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/GuitartApplication.lean#L104-L107","code":"def TateSplitting (L : FiniteGaloisIntermediateField ℚ (AlgebraicClosure ℚ)) : Prop :=\n  ∀ c : groupCohomology.cocycles₂ (trivialRepresentation Gal(L/ℚ) coefficients),\n    ∃ b : LocallyConstant Gal((AlgebraicClosure ℚ)/ℚ) coefficients,\n      ∀ σ τ : Gal((AlgebraicClosure ℚ)/ℚ), c (restriction L σ, restriction L τ) = coboundary b σ τ","papers":[["Tate in Ribet, Theorem 6.3","https://math.berkeley.edu/~ribet/Articles/korea.pdf#page=13"]],"uses":[],"later":[64],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-62"},{"key":"finitecoh","n":63,"title":"Finitely many cohomology classes on a finite group","kind":"Lemma","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/picard/UniformDescent.lean#L185-L205","code":"theorem finite_second_cohomology_units (G F : Type) [Group G] [Finite G] [Field F] [IsAlgClosed F] :\n    Finite (H2 (trivialRepresentation G (Additive Fˣ)))","papers":[],"uses":[],"later":[64],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-63"},{"key":"uniformfield","n":64,"title":"A splitting field independent of the surface","kind":"Theorem","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/picard/UniformDescent.lean#L301-L318","code":"theorem rational_uniform_splitting_degree (L : FiniteGaloisIntermediateField ℚ Qbar)\n    (hTate : ∀ c : cocycles₂ (trivialRepresentation Gal(L/ℚ) coefficients),\n      ∃ b : LocallyConstant Gal(Qbar/ℚ) coefficients, ∀ σ τ : Gal(Qbar/ℚ),\n        c (restriction L σ, restriction L τ) = coboundary b σ τ) :\n    ∃ (M : FiniteGaloisIntermediateField ℚ Qbar) (hLM : L ≤ M),\n      ∀ c : Gal(L/ℚ) × Gal(L/ℚ) → ℚˣ,\n        (∀ g h j, c (g*h,j) * c (g,h) = c (h,j) * c (g,h*j)) →\n        ∃ b : Gal(M/ℚ) → Qbarˣ, (∀ g h,\n          rationalUnit (c (finiteRestriction hLM g, finiteRestriction hLM h)) = b g * b h / b (g*h)) ∧\n          FiniteDimensional ℚ (coefficientField b) ∧\n          Module.finrank ℚ (coefficientField b) ≤ Module.finrank ℚ M","papers":[],"uses":[62,63],"later":[67],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-64"},{"key":"descend","n":65,"title":"Descent of the finite surjective morphism","kind":"Proposition","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/GuitartFormula.lean#L34-L46","code":"theorem descended_isogeny {A B : GroupScheme M} (a : IsAbelianScheme A) (d : IsAbelianScheme B)\n    (b : Gal(M/ℚ) → Qbarˣ) (c : Gal(M/ℚ) × Gal(M/ℚ) → ℚˣ) (hc : c (1,1) = 1)\n    (hb : ∀ g h, rationalUnit (c (g,h)) = b g * b h / b (g*h))\n    (φ : coefficientField b →ₐ[ℚ] (ℚ ⊗[ℤ] End ((F).obj A)))\n    (κ : (F).obj A ⟶ (F).obj B) (hf : IsFinite κ.hom.hom.hom.left) (hs : Surjective κ.hom.hom.hom.left)\n    (multiply : Multiplications) (law : GeometricLaw M b φ κ) :\n    ∃ f : A ⟶ B, IsFinite f.hom.hom.hom.left ∧ Surjective f.hom.hom.hom.left","papers":[],"uses":[52,58],"later":[66],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-65"},{"key":"onefibre","n":66,"title":"The rational variety for a single split cocycle","kind":"Proposition","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/GuitartApplication.lean#L84-L97","code":"theorem marked_fibre (M : FiniteGaloisIntermediateField ℚ (AlgebraicClosure ℚ))\n    (J A : GroupScheme M) (hA : IsAbelianScheme A)\n    (b : Gal(M/ℚ) → (AlgebraicClosure ℚ)ˣ) (c : Gal(M/ℚ) × Gal(M/ℚ) → ℚˣ) (hc : c (1,1) = 1)\n    (hb : ∀ g h, rationalUnit (c (g,h)) = b g * b h / b (g*h))\n    [NumberField (coefficientField b)]\n    (multiply : Multiplications) (W : GeometricIsogenyData M J A b) :\n    ∃ V : QuaternionVariety (coefficientField b),\n      ∃ f : A ⟶ (baseChange (algebraMap ℚ M)).obj V.B,\n        IsFinite f.hom.hom.hom.left ∧ AlgebraicGeometry.Surjective f.hom.hom.hom.left","papers":[],"uses":[59,65],"later":[67],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-66"},{"key":"allfibres","n":67,"title":"Uniform marked isogenies from the systems","kind":"Proposition","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/GuitartApplication.lean#L125-L143","code":"theorem uniform_marked_isogenies (L : FiniteGaloisIntermediateField ℚ (AlgebraicClosure ℚ))\n    (ψ : fixedField →ₐ[ℚ] L) (except : Finset ℚ) (tate : TateSplitting L)\n    (multiplication : Multiplications) (systems : GeometricSystems L ψ except) :\n    ∃ (M : FiniteGaloisIntermediateField ℚ (AlgebraicClosure ℚ)) (le : L ≤ M),\n      MarkedIsogenies ((IntermediateField.inclusion le).comp ψ) (Module.finrank ℚ M) except","papers":[],"uses":[64,61,66],"later":[69],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-67"},{"key":"markeddata","n":68,"title":"The precise marked-isogeny conclusion","kind":"Definition","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardPolynomial.lean#L167-L174","code":"def MarkedIsogenies {M : Type} [Field M] [NumberField M] (ψ : fixedField →ₐ[ℚ] M)\n    (D : ℕ) (except : Finset ℚ) : Prop :=\n  ∀ (t : ℚ) (ht : t ∉ contactSet), picardParameter t ∉ except →\n    ∃ (E : Type) (_ : Field E) (_ : NumberField E) (V : QuaternionVariety E),\n      Module.finrank ℚ E ≤ D ∧\n      let A := AbelianPowers.power ((baseChange ψ.toRingHom).obj (twistedJacobian t ht)) (Module.finrank ℚ E - 1)\n      let B := (baseChange (algebraMap ℚ M)).obj V.B\n      ∃ f : A ⟶ B, IsogenyHeight.IsIsogeny (M := M) (A := A) (B := B) f","papers":[],"uses":[],"later":[69],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/descent.md#s-68"},{"key":"marked","n":69,"title":"Uniform descent of the Picard Jacobians","kind":"Theorem","chapter":4,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardConclusion.lean#L30-L50","code":"theorem marked_isogenies\n    (cm : FiniteSplitValues) (prym : PicardPrym.PublishedPrymEndomorphisms)\n    (multi : MultiplicationTheorem) (multipliers : RationalMultipliers) (guitart : Ge ode":"theorem rational_fibre_data (hp : 3 \u003c p) (s : ℚ) (hb : primitiveBranch s ≠ 0)\n    (hev : ¬ Odd (padicValRat p (primitiveBranch s))) {ρ : W} (hρ : ρ^2= -3) :\n    ∃ ρ' : W, (ρ'=ρ ∨ ρ'= -ρ) ∧ ∃ (A : Finset (Fin 2)) (m : ℕ),\n      Nonempty (FibreData p s.num s.den (twist s) ρ' A m)","papers":[],"uses":[70],"later":[78,79,83],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/reduction.md#s-72"},{"key":"oddclusters","n":73,"title":"Cardinalities of the proper clusters","kind":"Lemma","chapter":5,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/picard/LocalSupport.lean#L568","code":"theorem proper_odd : ∀ (A : Finset (Fin 2)), ∀ s ∈ tree A, s ≠ Finset.univ → Odd s.card","papers":[],"uses":[],"later":[78],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/reduction.md#s-73"},{"key":"rownu","n":74,"title":"The local integer at a triple","kind":"Lemma","chapter":5,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/picard/LocalSupport.lean#L604-L611","code":"theorem nu_row (lead : ℤ) (A : Finset (Fin 2)) (m : ℕ) {i : Fin 2} (hi : i∈A) :\n    nu lead A (distances A (m:ℕ∞)) (row i) = lead+3*m","papers":[],"uses":[],"later":[78],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/reduction.md#s-74"},{"key":"topnu","n":75,"title":"The local integer at the full set","kind":"Lemma","chapter":5,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/picard/LocalSupport.lean#L613-L614","code":"theorem nu_top (lead : ℤ) (A : Finset (Fin 2)) (m : ℕ) :\n    nu lead A (distances A (m:ℕ∞)) Finset.univ = lead","papers":[],"uses":[],"later":[78],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/reduction.md#s-75"},{"key":"goodwitt","n":76,"title":"Good reduction over the Witt ring","kind":"Definition","chapter":5,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/picard/PicardAssembly.lean#L99-L101","code":"def GoodWitt (k : Subfield (Residues p)) (A : GroupScheme (FractionRing (WittVector p k))) : Prop :=\n  ∃ M : GroupScheme (WittVector p k), IsAbelianScheme M ∧\n    Nonempty ((baseChange (algebraMap (WittVector p k) (FractionRing (WittVector p k)))).obj M ≅ A)","papers":[],"uses":[],"later":[77,80],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/reduction.md#s-76"},{"key":"ddmm","n":77,"title":"The split-sextic criterion for good reduction","kind":"Hypothesis","chapter":5,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardGoodReduction.lean#L90-L102","code":"def SplitSexticDDMM : Prop := ∀ (p : ℕ) [Fact p.Prime], 2 \u003c p →\n  ∀ (k : Subfield (Residues p)) [Finite k],\n  letI := wittCharZero p k\n  let S := WittVector p k\n  let K := FractionRing S\n  ∀ (f : S[X]) (x : Index → S),\n    f.Splits → (∀ w, f.IsRoot w ↔ ∃ i, x i = w) →\n    let dist := fun i j => addVal S (x i - x j)\n    let P := clusterTree dist\n    (∀ s ∈ P, s ≠ Finset.univ → Odd s.card) →\n    (∀ s, picturePrincipal P s → Even (pictureNu P ((addVal S f.leadingCoeff).toNat : ℤ) dist s)) →\n    ∀ (dg : (f.map (algebraMap S K)).natDegree = 6) (sg : (f.map (algebraMap S K)).Separable),\n      GoodWitt p k (completionJacobian _ dg sg)","papers":[["Dokchitser–Dokchitser–Maistret–Morgan, Theorems 1.9(5) and 10.3(5)","https://doi.org/10.1007/s00208-021-02319-y"]],"uses":[76],"later":[78,113],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/reduction.md#s-77"},{"key":"splitgood","n":78,"title":"Good reduction of the local Jacobian","kind":"Proposition","chapter":5,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardGoodReduction.lean#L174-L199","code":"theorem goodWitt_of_fibre (criterion : SplitSexticDDMM) (p : ℕ) [Fact p.Prime] (hp : 3 \u003c p)\n    (t : ℚ) (e : ℤ) (ht : t ∉ contactSet) (he : e ≠ 0) {q : PicardLocal.WittRing p}\n    {A : Finset (Fin 2)} {m : ℕ} (D : FibreData p (picardParameter t).num (picardParameter t).den e q A m)\n    (comparison : WittComparison t e ht he D.finiteModel) : GoodLocalFiber t e ht he D.finiteModel","papers":[],"uses":[77,72,73,74,75,71],"later":[82],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/reduction.md#s-78"},{"key":"commonlocal","n":79,"title":"A common unramified local field","kind":"Proposition","chapter":5,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/CommonWittField.lean#L206-L233","code":"theorem common_marked_fibre (M : Type*) [Field M] [NumberField M] [Normal ℚ M]\n    (δ : M) (hδ : δ^2 = -3) :\n    ∃ N : ℤ, N ≠ 0 ∧ ∀ (p : ℕ) [Fact p.Prime], (N : ZMod p) ≠ 0 →\n      ∀ {a b e : ℤ} {q : WittRing p} {A : Finset (Fin 2)} {m : ℕ}, q^2 = -3 →\n      ∀ D : FibreData p a b e q A m, ∃ D' : FibreData p a b e q A m,\n        D.finiteModel.field ≤ D'.finiteModel.field ∧ D'.roots = D.roots ∧\n        let S := WittVector p D'.finiteModel.field\n        letI := wittCharZero p D'.finiteModel.field\n        ∃ i : M →ₐ[ℚ] FractionRing S, i δ = algebraMap S (FractionRing S) D'.finiteModel.rho","papers":[],"uses":[72],"later":[82],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/reduction.md#s-79"},{"key":"st","n":80,"title":"Good reduction under quotient and unramified descent","kind":"Hypothesis","chapter":5,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/picard/PicardAssembly.lean#L106-L112","code":"def SerreTateAt : Prop := ∀ (k : Subfield (Residues p)) [Finite k],\n  letI := wittFractionAlgebra p k\n  let K := FractionRing (WittVector p k)\n  (∀ (A B : GroupScheme K), IsAbelianScheme A → IsAbelianScheme B →\n    ∀ f : A ⟶ B, Surjective f.hom.hom.hom.left → GoodWitt p k A → GoodWitt p k B) ∧\n  (∀ B : GroupScheme ℚ_[p], IsAbelianScheme B →\n    GoodWitt p k ((baseChange (algebraMap ℚ_[p] K)).obj B) → HasGoodReduction p B)","papers":[["Serre–Tate, Theorem 1 and Corollaries 2, 4","https://wstein.org/papers/bib/Serre-Tate-Good_Reduction_of_Abelian_Varieties.pdf"]],"uses":[76],"later":[82,113],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/reduction.md#s-80"},{"key":"localmap","n":81,"title":"Localizing the global power quotient","kind":"Lemma","chapter":5,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardPolynomial.lean#L98-L125","code":"theorem local_of_global (p : ℕ) [Fact p.Prime] (k : Subfield (Residues p)) [Finite k]\n    {M : Type} [Field M] [NumberField M] (ψ : fixedField →ₐ[ℚ] M)\n    (t : ℚ) (ht : t ∉ contactSet) (n : ℕ) (B : GroupScheme ℚ) (h : GlobalPowerQuotient ψ t ht n B) :\n    letI := CommonWittField.wittCharZero p k\n    let K := FractionRing (WittVector p k)\n    let J := twistedJacobian t ht\n    ∀ i : M →ₐ[ℚ] K, LocalPowerQuotient p k ((baseChange (i.comp ψ).toRingHom).obj J) n B","papers":[],"uses":[],"later":[82,110],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/reduction.md#s-81"},{"key":"reduce","n":82,"title":"Good reduction of the rational factor","kind":"Theorem","chapter":5,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/CommonWittReduction.lean#L79-L90","code":"theorem good_reduction_of_clusters (M : Type) [Field M] [NumberField M] [Normal ℚ M]\n    (ψ : fixedField →ₐ[ℚ] M) :\n    ∃ S : Finset ℕ, (∀ p ∈ S, p.Prime) ∧ 2 ∈ S ∧ 3 ∈ S ∧\n      ∀ (p : ℕ) [Fact p.Prime], p ∉ S → SplitSexticDDMM → SerreTateAt p →\n      ∀ (t : ℚ) (ht : t ∉ contactSet) (B : GroupScheme ℚ), IsAbelianScheme B →\n      ∀ n : ℕ, LocalPowerMaps p M ψ t ht B n →\n        ClusterCondition p (picardParameter t) → GoodReductionAt p B","papers":[],"uses":[78,79,80,81],"later":[110],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/reduction.md#s-82"},{"key":"outside","n":83,"title":"Which primes require inversion","kind":"Lemma","chapter":5,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/picard/PicardAssembly.lean#L48-L59","code":"theorem clusters_outside {fixed : Finset ℕ} (h₂ : 2 ∈ fixed) (h₃ : 3 ∈ fixed)\n    {s : ℚ} (hb : primitiveBranch s ≠ 0) (p : ℕ) [hp : Fact p.Prime]\n    (out : p ∉ inverted fixed s) : 3 \u003c p ∧ p ∉ fixed ∧ ClusterCondition p s","papers":[],"uses":[72],"later":[106],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/reduction.md#s-83"},{"key":"invariant","n":84,"title":"The absolute invariant as a rational function","kind":"Lemma","chapter":6,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/picard/PicardDiscriminant.lean#L162-L175","code":"theorem invariant_at (ρ : K) (hρ : ρ^2 = -3) {t : ℚ} (ht : t ∉ ZInQ.contactSet) :\n    let s := (ZInQ.QualitativeHeight.picardParameter t : K)\n    let U := (s+ρ)^6\n    let V := (s-ρ)^6\n    (secondInvariant (coefficients U V))^5 / (sextic U V).discr =\n      (((ZInQ.JHeight.Jmap t + 4)^5 / (200000*(ZInQ.JHeight.Jmap t)^3) : ℚ) : K)","papers":[],"uses":[38,37],"later":[85,91],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/periods.md#s-84"},{"key":"comparison","n":85,"title":"Recovering the height of the Picard parameter","kind":"Lemma","chapter":6,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/bounded/PicardCriterion.lean#L42-L56","code":"theorem parameter_le_invariant {s : ℚ} (hs : s ≠ 5) (hb : primitiveBranch s ≠ 0) :\n    ratHeight s ≤ ratHeight (igusaRatio (chart s)) +\n      (450 + Real.log 1024 + ratHeight 5 + ratHeight 120 + ratH .com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/bounded/QualitativeHeight.lean#L171-L227","code":"theorem exists_uniform_height_bound (fixed : Finset ℕ) (except : Finset ℚ) (bad : ℚ → Finset ℕ)\n    {A B : ℝ} (hA : 0 ≤ A) (fixedPrimes : ∀ p ∈ fixed, p.Prime)\n    (support : ∀ s : ℚ, s ∉ except → primitiveBranch s ≠ 0 →\n      ∀ p ∈ bad s, p.Prime ∧ (p ∈ fixed ∨ Odd (padicValRat p (primitiveBranch s))))\n    (height : ∀ s : ℚ, s ∉ except → primitiveBranch s ≠ 0 →\n      ratHeight s ≤ A * ((∏ p ∈ bad s, p : ℕ) : ℝ)^24 + B) :\n    ∃ m : ℕ, 1 ≤ m ∧ ∀ t : ℚ, t ∉ contactSet →\n      ratHeight t ≤ (m : ℝ) * (contactSupport Mult.S_mul t : ℝ)^24","papers":[],"uses":[2,103,104],"later":[107],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/global-height.md#s-105"},{"key":"goodoutside","n":106,"title":"Good reduction away from the prescribed set","kind":"Lemma","chapter":7,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/picard/PicardAssembly.lean#L153-L157","code":"theorem good_outside {g fixed s} (b : RationalFactor g fixed s)\n    (h₂ : 2 ∈ fixed) (h₃ : 3 ∈ fixed) (hb : primitiveBranch s ≠ 0) : GoodOutside b.B (inverted fixed s)","papers":[],"uses":[83],"later":[107],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/global-height.md#s-106"},{"key":"factors","n":107,"title":"Rational factors of bounded dimension suffice","kind":"Proposition","chapter":7,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/picard/PicardAssembly.lean#L202-L234","code":"theorem integer_polynomial_of_factor_comparison (hF : GroupScheme ℚ → ℝ) (vk : VonKanel hF)\n    (G : ℕ) (a b₀ : ℝ) (ha : 0 ≤ a) (fixed : Finset ℕ) (except : Finset ℚ)\n    (primes : ∀ p ∈ fixed, p.Prime) (h₂ : 2 ∈ fixed) (h₃ : 3 ∈ fixed)\n    (fibres : ∀ s : ℚ, s ∉ except → primitiveBranch s ≠ 0 →\n      ∃ (g : ℕ) (b : RationalFactor g fixed s), 0 \u003c g ∧ g ≤ G ∧\n        ratHeight (igusaRatio (chart s)) ≤ a*max 1 (hF b.B)+b₀)\n    (tian : ZInQBlueprint.OriginalRank.PublishedGenusRows.PublishedTian47)\n    (grossZagier : ZOverQ.Bounded.SimpleZeroRank) : IntegerPolynomial","papers":[],"uses":[100,101,85,105,106,35],"later":[109],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/global-height.md#s-107"},{"key":"charth","n":108,"title":"Height of a quotient of homogeneous forms","kind":"Lemma","chapter":7,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/picard/PicardAssembly.lean#L269-L291","code":"theorem height_of_algebraic_charts (P : InvariantCharts K n m) :\n    ∃ a b : ℝ, 0 ≤ a ∧ ∀ (z : Fin n → K) (r : ℚ), P.Represents z r →\n      ratHeight r ≤ a * normalizedHeight z + b","papers":[],"uses":[],"later":[109],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/global-height.md#s-108"},{"key":"charts","n":109,"title":"Passing from the moduli point to its value","kind":"Proposition","chapter":7,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/picard/PicardAssembly.lean#L296-L311","code":"theorem integer_polynomial_of_moduli_charts (P : InvariantCharts K n m)\n    (hF : GroupScheme ℚ → ℝ) (vk : VonKanel hF) (G : ℕ) (u v : ℝ) (hu : 0 ≤ u)\n    (fixed : Finset ℕ) (except : Finset ℚ) (primes : ∀ p ∈ fixed, p.Prime)\n    (h₂ : 2 ∈ fixed) (h₃ : 3 ∈ fixed)\n    (fibres : ∀ s : ℚ, s ∉ except → primitiveBranch s ≠ 0 →\n      ∃ (g : ℕ) (b : RationalFactor g fixed s) (z : Fin n → K),\n        0 \u003c g ∧ g ≤ G ∧ P.Represents z (igusaRatio (chart s)) ∧ normalizedHeight z ≤ u*max 1 (hF b.B)+v)\n    (tian : ZInQBlueprint.OriginalRank.PublishedGenusRows.PublishedTian47)\n    (grossZagier : ZOverQ.Bounded.SimpleZeroRank) : IntegerPolynomial","papers":[],"uses":[108,107],"later":[110],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/global-height.md#s-109"},{"key":"quatendpoint","n":110,"title":"The local and global data on the same rational factor","kind":"Proposition","chapter":7,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardPolynomial.lean#L129-L164","code":"theorem integer_polynomial_of_quaternionic_fibres\n    {K : Type} [Field K] [NumberField K] {n m : ℕ} (P : InvariantCharts K n m)\n    (M : Type) [Field M] [NumberField M] [Normal ℚ M] (ψ : fixedField →ₐ[ℚ] M)\n    (hF : GroupScheme ℚ → ℝ) (vk : VonKanel hF) (criterion : SplitSexticDDMM)\n    (st : ∀ (p : ℕ) [Fact p.Prime], SerreTateAt p)\n    (D : ℕ) (u v : ℝ) (hu : 0 ≤ u) (except : Finset ℚ)\n    (fibres : ∀ (t : ℚ) (ht : t ∉ contactSet), picardParameter t ∉ except →\n      ∃ (E : Type) (_ : Field E) (_ : NumberField E) (V : QuaternionVariety E) (z : Fin n → K),\n        Module.finrank ℚ E ≤ D ∧ GlobalPowerQuotient ψ t ht (Module.finrank ℚ E - 1) V.B ∧\n        P.Represents z (igusaRatio (chart (picardParameter t))) ∧\n        normalizedHeight z ≤ u * max 1 (hF V.B) + v)\n    (tian : ZInQBlueprint.OriginalRank.PublishedGenusRows.PublishedTian47)\n    (grossZagier : ZOverQ.Bounded.SimpleZeroRank) : IntegerPolynomial","papers":[],"uses":[81,82,98,109],"later":[111],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/global-height.md#s-110"},{"key":"picard","n":111,"title":"Marked isogenies and a height comparison on the Jacobian","kind":"Proposition","chapter":7,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardPolynomial.lean#L189-L229","code":"theorem integer_polynomial_of_picard_jacobians\n    {K : Type} [Field K] [NumberField K] {n m : ℕ} (P : InvariantCharts K n m)\n    (M : Type) [Field M] [NumberField M] [Normal ℚ M] (ψ : fixedField →ₐ[ℚ] M)\n    (hF : GroupScheme ℚ → ℝ) (F : GroupScheme M → ℝ)\n    (vk : VonKanel hF) (criterion : SplitSexticDDMM)\n    (st : ∀ (p : ℕ) [Fact p.Prime], SerreTateAt p)\n    (D : ℕ) (stable : IsogenyHeight.StableHeight F) (degree : IsogenyHeight.DegreeBound F (2*D))\n    (extend : ∀ B : GroupScheme ℚ, IsAbelianScheme B → F ((baseChange (algebraMap ℚ M)).obj B) = hF B)\n    (exceptDescent exceptModuli : Finset ℚ) (u v : ℝ) (hu : 0 ≤ u)\n    (descent : MarkedIsogenies ψ D exceptDescent)\n    (moduli : PolarizedModuliHeight P ψ F exceptModuli u v)\n    (tian : ZInQBlueprint.OriginalRank.PublishedGenusRows.PublishedTian47)\n    (grossZagier : ZOverQ.Bounded.SimpleZeroRank) : IntegerPolynomial","papers":[],"uses":[96,110],"later":[112],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/global-height.md#s-111"},{"key":"periods-to-poly","n":112,"title":"The conditional polynomial over a given descent field","kind":"Proposition","chapter":7,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardPeriods.lean#L175-L187","code":"theorem integer_polynomial_of_sextic_periods\n    (M : Type) [Field M] [NumberField M] [Normal ℚ M] (ψ : fixedField →ₐ[ℚ] M) (η : M →+* ℂ)\n    (hF : GroupScheme ℚ → ℝ) (F : GroupScheme M → ℝ)\n    (vk : VonKanel hF) (criterion : PicardGoodReduction.SplitSexticDDMM)\n    (st : ∀ (p : ℕ) [Fact p.Prime], SerreTateAt p)\n    (D : ℕ) (stable : IsogenyHeight.StableHeight F) (degree : IsogenyHeight.DegreeBound F (2*D))\n    (extend : ∀ B : GroupScheme ℚ, IsAbelianScheme B → F ((baseChange (algebraMap ℚ M)).obj B) = hF B)\n    (except : Finset ℚ) (descent : MarkedIsogenies ψ D except) (periods : SexticPeriods η F)\n    (tian : ZInQBlueprint.OriginalRank.PublishedGenusRows.PublishedTian47)\n    (grossZagier : ZOverQ.Bounded.SimpleZeroRank) : IntegerPolynomial","papers":[],"uses":[111,95],"later":[113],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/global-height.md#s-112"},{"key":"final","n":113,"title":"Conditional Diophantine definition of the integers","kind":"Theorem","chapter":7,"lean":"https://github.com/nasqret/z-in-q-lean/blob/95357929cf16cedd3dd1960c11060cb923f5bdca/Lean/Lemmas/picard-application/PicardConclusion.lean#L65-L76","code":"theorem integer_polynomial_of_arithmetic_geometry\n    (cm : FiniteSplitValues) (prym : PicardPrym.PublishedPrymEndomorphisms)\n    (multi : MultiplicationTheorem) (multipliers : RationalMultipliers) (guitart : GeometricDescent)\n    (tate : ∀ L, TateSplitting L)\n    (hF : GroupScheme ℚ → ℝ) (heights : HeightComparisons hF) (vk : VonKanel hF)\n    (ddmm : PicardGoodReduction.SplitSexticDDMM) (st : ∀ (p : ℕ) [Fact p.Prime], SerreTateAt p)\n    (tian : ZInQBlueprint.OriginalRank.PublishedGenusRows.PublishedTian47)\n    (grossZagier : ZOverQ.Bounded.SimpleZeroRank) : IntegerPolynomial := by\n  obtain ⟨M,ψ,except,marked⟩ := marked_isogenies cm prym multi multipliers guitart tate\n  obtain ⟨F,η,stable,degree,extension,periods⟩ := heights M\n  exact PicardPeriods.integer_polynomial_of_sextic_periods M ψ η hF F vk ddmm st\n    (Module.finrank ℚ M) stable degree extension except marked periods tian grossZagier","papers":[],"uses":[69,90,100,77,80,5,6,112],"later":[],"read":"https://github.com/nasqret/z-in-q-lean/blob/main/docs/blueprint/sections/global-height.md#s-113"}]}</script>
<script>
"use strict";
const byId = id => document.getElementById(id);
const {chapters, statements} = JSON.parse(byId("data").textContent);
const rows = new Map(statements.map(row => [row.n, row]));
const isExternal = row => ["Hypothesis", "Clause"].includes(row.kind);
function link(text, href) {
  const a = document.createElement("a");
  a.textContent = text;
  a.href = href;
  return a;
}
function reference(n) {
  const row = rows.get(n);
  const a = link(row.title, "#s-" + n);
  const type = document.createElement("span");
  type.className = "kind";
  type.textContent = row.kind + " " + n;
  a.prepend(type);
  if (isExternal(row)) a.classList.add("assumed");
  return a;
}
function neighbours(id, ns, empty) {
  const ul = byId(id);
  ul.replaceChildren();
  if (!ns.length) {
    const li = document.createElement("li");
    li.className = "minor"; li.textContent = empty;
    ul.append(li);
  }
  for (const n of ns) {
    const li = document.createElement("li");
    li.append(reference(n)); ul.append(li);
  }
}
function select() {
  const match = /^#s-(\d+)$/.exec(location.hash);
  const row = rows.get(match ? Number(match[1]) : 0) || statements.at(-1);
  byId("section").textContent = "§" + row.chapter + "   " + chapters[row.chapter - 1];
  byId("title").textContent = row.kind + " " + row.n + ". " + row.title;
  byId("kind").textContent = row.kind + " " + row.n;
  byId("focus-title").textContent = row.title;
  byId("focus").classList.toggle("assumed", isExternal(row));
  neighbours("parents", row.uses, "No earlier numbered prerequisites.");
  neighbours("children", row.later, "This is the final conclusion.");
  const label = isExternal(row) || row.kind === "Definition" ? "Lean statement" : "Lean proof";
  byId("primary").replaceChildren(link(label, row.lean), link("Mathematical statement and derivation", row.read));
  byId("literature").hidden = !row.papers.length;
  byId("papers").replaceChildren(...row.papers.map(([name, url]) => link(name, url)));
  byId("code").textContent = row.code;
  for (const [id, step, word] of [["prev",-1,"Previous"],["next",1,"Next"]]) {
    const near = rows.get(row.n + step);
    byId(id).replaceChildren(...(near ? [link(word + " · " + near.kind + " " + near.n, "#s-" + near.n)] : []));
  }
}
function filter() {
  const q = byId("query").value.trim().toLowerCase();
  const ch = byId("chapter").value;
  const kind = byId("type").value;
  const list = byId("matches");
  list.replaceChildren();
  list.hidden = !(q || ch || kind);
  if (list.hidden) return;
  for (const row of statements) {
    if (ch && row.chapter !== Number(ch) || kind && row.kind !== kind) continue;
    const search = [String(row.n), row.title, row.code.split("\n")[0]].join(" ").toLowerCase();
    if (q && (/^\d+$/.test(q) ? row.n !== Number(q) : !search.includes(q))) continue;
    const li = document.createElement("li");
    li.append(link(row.kind + " " + row.n + ". " + row.title, "#s-" + row.n));
    list.append(li);
  }
  if (!list.children.length) {
    const li = document.createElement("li"); li.textContent = "No matching statements."; list.append(li);
  }
}
chapters.forEach((name, i) => byId("chapter").add(new Option((i+1) + ". " + name, String(i+1))));
byId("filter").addEventListener("submit", event => {event.preventDefault(); const a = byId("matches").querySelector("a"); if (a) a.click();});
byId("filter").addEventListener("input", filter);
window.addEventListener("hashchange", select);
select();
</script>
