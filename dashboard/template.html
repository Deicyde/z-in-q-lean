<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proof explorer · Integers among the rationals</title>
<style>
:root{color-scheme:light;--ink:#17372e;--soft:#496157;--border:#cbd8d1;--green:#176954;--paper:#fbfcf9;--tint:#edf4ef}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}header,main{max-width:1240px;margin:auto;padding:22px 4vw}header{border-bottom:1px solid var(--border)}h1,h2,h3{line-height:1.2}h1{font:600 clamp(2rem,5vw,3rem)/1.08 Georgia,serif;margin:5px 0 12px}h2{font:600 1.6rem/1.2 Georgia,serif;margin:10px 0}p{margin:8px 0 14px}label{display:block;font-size:.86rem;font-weight:650;margin-bottom:4px}input,select{width:100%;border:1px solid #83978b;border-radius:5px;color:var(--ink);background:white;padding:9px;font:inherit}.filters{display:grid;grid-template-columns:2fr 1.2fr 1.2fr;gap:14px}.grid{display:grid;grid-template-columns:minmax(260px, .84fr) minmax(0,1.4fr);gap:24px;margin-top:14px}.list{max-height:65vh;overflow:auto;border-block:1px solid var(--border)}.list button{border:0;border-bottom:1px solid var(--border);background:transparent;text-align:left;width:100%;line-height:1.3}.list button[aria-current=true]{background:#dceee5;border-left:4px solid var(--green)}button{font:inherit;color:var(--ink);cursor:pointer;padding:8px 12px}button:hover{background:var(--tint)}:focus-visible{outline:3px solid #175d96;outline-offset:2px}small,.detailmeta{display:block;color:var(--soft);font-size:.84rem}article{padding:0 4px}a{color:#145c7c}ul{padding-left:1.3em}code{overflow-wrap:anywhere}details{padding:10px 0;border-top:1px solid var(--border)}summary{cursor:pointer;font-weight:600}.neighbors{display:grid;grid-template-columns:1fr 1fr;gap:12px}.neighbors button{width:100%;text-align:left;border:1px solid var(--border);border-radius:5px;background:#fff;margin:3px 0;font-size:.9rem}.neighbors button:hover{background:var(--tint)}.neighbors h3{font-size:.95rem}.status{font-weight:680}#count{margin:10px 0 0;color:var(--soft)}header a{margin-right:16px}.focus{margin:22px 0 10px;padding:10px 14px;border-left:4px solid var(--green);background:var(--tint);font-weight:650}noscript{display:block;padding:2em}@media(max-width:720px){.filters{grid-template-columns:1fr}.grid{display:flex;flex-direction:column}.list{max-height:25vh}.neighbors{grid-template-columns:1fr}header,main{padding:16px}}@media print{.filters,.list,#count,header nav{display:none}.grid{display:block}}
</style></head><body><header><h1>Proof explorer</h1><p>Mathematical statements, their hypotheses and their place in the proof.</p><nav><a href="https://github.com/nasqret/z-in-q-lean/blob/main/docs/theorem-blueprint.md">Mathematical blueprint</a><a href="https://github.com/nasqret/z-in-q-lean/blob/main/dashboard/README.md">Chapter tables</a></nav></header>
<main><div class="filters"><div><label for="query">Find a theorem or declaration</label><input id="query" type="search" placeholder="e.g. Jacobian or genus coefficient"></div><div><label for="route">Construction</label><select id="route"><option value="">All constructions</option></select></div><div><label for="state">Proof status</label><select id="state"><option value="">All states</option></select></div></div><p id="count" role="status"></p><div class="grid"><nav id="list" class="list" aria-label="Matching statements"></nav><article id="detail" aria-live="polite"></article></div></main>
<noscript>The complete chapter tables are readable in dashboard/README.md.</noscript>
<script id="data" type="application/json">__BLUEPRINT_DATA__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("data").textContent), rows=data.packages, index=new Map(rows.map(r=>[r.id,r]));
const states={kernel:"Kernel checked",public:"Upstream proof",typed:"Header only",binding:"Open application",missing:"Needs a header"};
const dependents=new Map(rows.map(r=>[r.id,[]]));for(const r of rows)for(const n of r.needs)dependents.get(n).push(r.id);
const el=id=>document.getElementById(id), make=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
function options(id,items){for(const [k,label] of items){const o=make("option",label);o.value=k;el(id).append(o);}}
options("route",data.routes.map(x=>[x,x]));options("state",Object.entries(states));
const haystack=new Map(rows.map(r=>[r.id,[r.title,r.claim,r.chapter,...r.headers].join(" ").toLowerCase()]));
function matches(){const q=el("query").value.trim().toLowerCase();return rows.filter(r=>(!el("route").value||r.routes.includes(el("route").value))&&(!el("state").value||r.state===el("state").value)&&haystack.get(r.id).includes(q));}
let current=null;
function select(r,fromGraph=false){current=r;history.replaceState(null,"","#"+r.id);
 if(fromGraph&&!matches().some(x=>x.id===r.id)){el("query").value="";el("route").value="";el("state").value="";renderList();}
 for(const b of el("list").children)b.setAttribute("aria-current",b.dataset.id===r.id?"true":"false");
 const panel=el("detail");panel.replaceChildren(make("div",r.chapter,"detailmeta"),make("h2",r.title),make("p",states[r.state]+" · "+r.routes.join(" · "),"status"),make("p",r.claim));
 panel.append(make("div","Dependencies of this statement","focus"));const neighbors=make("div",undefined,"neighbors");panel.append(neighbors);
 for(const [title,ids] of [["Uses",r.needs],["Used by",dependents.get(r.id)]]){const box=make("section");neighbors.append(box);box.append(make("h3",title+" ("+ids.length+")"));if(!ids.length)box.append(make("small","None recorded."));for(const id of ids){const n=index.get(id),b=make("button",n.title);b.append(make("small",states[n.state]));b.onclick=()=>select(n,true);box.append(b);}}
 if(r.headers.length){const details=make("details"),sum=make("summary","Lean declarations ("+r.headers.length+")"),ul=make("ul");details.append(sum,ul);panel.append(details);for(const h of r.headers){const li=make("li"),code=make("code",h);if(data.declarations[h]){const a=make("a");a.href="https://github.com/nasqret/z-in-q-lean/blob/main/"+data.declarations[h];a.append(code);li.append(a);}else li.append(code);ul.append(li);}}
}
function renderList(preferred){const found=matches(),list=el("list");list.replaceChildren();el("count").textContent=found.length+" of "+rows.length+" statements";for(const r of found){const b=make("button",r.title);b.dataset.id=r.id;b.append(make("small",states[r.state]));b.onclick=()=>select(r);list.append(b);}
 if(!found.length){current=null;el("detail").replaceChildren(make("h2","No matching statement"),make("p","Change the search or select another construction."));return;}
 select(found.find(r=>r.id===preferred)||found.find(r=>current&&r.id===current.id)||found[0]);}
for(const name of ["query","route","state"])el(name).addEventListener("input",()=>renderList());
renderList(location.hash.slice(1)||"signed-jacobian-original-endpoint");
</script></body></html>
