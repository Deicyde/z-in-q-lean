<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proof explorer · Integers among the rationals</title>
<style>
:root{color-scheme:light;--ink:#17372e;--soft:#496157;--border:#cbd8d1;--green:#176954;--paper:#fbfcf9;--tint:#edf4ef}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}header,main{max-width:1240px;margin:auto;padding:22px 4vw}header{border-bottom:1px solid var(--border)}h1,h2,h3{line-height:1.2}h1{font:600 clamp(2rem,5vw,3rem)/1.08 Georgia,serif;margin:5px 0 12px}h2{font:600 1.6rem/1.2 Georgia,serif;margin:10px 0}p{margin:8px 0 14px}label{display:block;font-size:.86rem;font-weight:650;margin-bottom:4px}input,select{width:100%;border:1px solid #83978b;border-radius:5px;color:var(--ink);background:white;padding:9px;font:inherit}.filters{display:grid;grid-template-columns:2fr 1.2fr 1.2fr;gap:14px}.grid{display:grid;grid-template-columns:minmax(260px, .84fr) minmax(0,1.4fr);gap:24px;margin-top:14px}.list{max-height:65vh;overflow:auto;border-block:1px solid var(--border)}.list button{border:0;border-bottom:1px solid var(--border);background:transparent;text-align:left;width:100%;line-height:1.3}.list button[aria-current=true]{background:#dceee5;border-left:4px solid var(--green)}button{font:inherit;color:var(--ink);cursor:pointer;padding:8px 12px}button:hover{background:var(--tint)}:focus-visible{outline:3px solid #175d96;outline-offset:2px}small,.detailmeta{display:block;color:var(--soft);font-size:.84rem}article{padding:0 4px}a{color:#145c7c}ul{padding-left:1.3em}code{overflow-wrap:anywhere}details{padding:10px 0;border-top:1px solid var(--border)}summary{cursor:pointer;font-weight:600}.neighbors{display:grid;grid-template-columns:1fr 1fr;gap:12px}.neighbors button{width:100%;text-align:left;border:1px solid var(--border);border-radius:5px;background:#fff;margin:3px 0;font-size:.9rem}.neighbors button:hover{background:var(--tint)}.neighbors h3{font-size:.95rem}.status{font-weight:680}#count{margin:10px 0 0;color:var(--soft)}header a{margin-right:16px}.focus{margin:22px 0 10px;padding:10px 14px;border-left:4px solid var(--green);background:var(--tint);font-weight:650}noscript{display:block;padding:2em}@media(max-width:720px){.filters{grid-template-columns:1fr}.grid{display:flex;flex-direction:column}.list{max-height:25vh}.neighbors{grid-template-columns:1fr}header,main{padding:16px}}@media print{.filters,.list,#count,header nav{display:none}.grid{display:block}}
</style></head><body><header><h1>Proof explorer</h1><p>Mathematical statements, their hypotheses and their place in the proof.</p><nav><a href="https://github.com/nasqret/z-in-q-lean/blob/main/docs/theorem-blueprint.md">Mathematical blueprint</a><a href="https://github.com/nasqret/z-in-q-lean/blob/main/docs/qualitative-existence.md#the-end-to-end-theorem-and-its-literature-inputs">Qualitative theorem and hypotheses</a><a href="https://github.com/nasqret/z-in-q-lean/blob/main/dashboard/README.md">Chapter tables</a></nav></header>
<main><div class="filters"><div><label for="query">Find a theorem or declaration</label><input id="query" type="search" placeholder="e.g. Jacobian or genus coefficient"></div><div><label for="route">Construction</label><select id="route"><option value="">All constructions</option></select></div><div><label for="state">Proof status</label><select id="state"><option value="">All states</option></select></div></div><p id="count" role="status"></p><div class="grid"><nav id="list" class="list" aria-label="Matching statements"></nav><article id="detail" aria-live="polite"></article></div></main>
<noscript>The complete chapter tables are readable in dashboard/README.md.</noscript>
<script id="data" type="application/json">__BLUEPRINT_DATA__</script>
<script>
"use strict";

const element = id => document.getElementById(id);
const data = JSON.parse(element("data").textContent);
const rows = new Map(data.packages.map(row => [row.id, row]));
const states = {
  kernel: "Kernel checked", public: "Upstream proof", typed: "Header only",
  binding: "Open application", missing: "Needs a header"
};
const dependents = new Map(data.packages.map(row => [row.id, []]));
for (const row of rows.values()) {
  for (const prerequisite of row.needs) dependents.get(prerequisite).push(row.id);
}
const searchable = new Map(data.packages.map(row => [
  row.id, [row.title, row.claim, row.chapter, ...row.headers].join(" ").toLowerCase()
]));
let selectedId;

function make(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function options(id, entries) {
  for (const [value, label] of entries) {
    const option = make("option", label);
    option.value = value;
    element(id).append(option);
  }
}
options("route", data.routes.map(route => [route, route]));
options("state", Object.entries(states));

function matchingRows() {
  const text = element("query").value.trim().toLowerCase();
  const route = element("route").value;
  const state = element("state").value;
  return data.packages.filter(row =>
    (!route || row.routes.includes(route)) && (!state || row.state === state) &&
    searchable.get(row.id).includes(text));
}

function rowButton(row, subtitle) {
  const button = make("button", row.title);
  button.dataset.id = row.id;
  button.append(make("small", subtitle));
  button.addEventListener("click", () => navigate(row.id, true));
  return button;
}

function showDetail(row) {
  const panel = element("detail");
  panel.replaceChildren();
  if (!row) {
    panel.append(make("h2", "No matching statement"), make("p", "Change your search or filters."));
    return;
  }
  panel.append(make("div", row.chapter, "detailmeta"), make("h2", row.title),
    make("p", [states[row.state], ...row.routes].join(" · "), "status"), make("p", row.claim));
  const neighbors = make("div", undefined, "neighbors");
  panel.append(make("div", "Dependencies of this statement", "focus"), neighbors);
  for (const [title, ids] of [["Uses", row.needs], ["Used by", dependents.get(row.id)]]) {
    const box = make("section");
    box.append(make("h3", title + " (" + ids.length + ")"));
    if (!ids.length) box.append(make("small", "None recorded."));
    for (const id of ids) box.append(rowButton(rows.get(id), states[rows.get(id).state]));
    neighbors.append(box);
  }
  if (!row.headers.length) return;
  const details = make("details");
  const names = make("ul");
  details.append(make("summary", "Lean declarations (" + row.headers.length + ")"), names);
  for (const name of row.headers) {
    const item = make("li");
    const code = make("code", name);
    const path = data.declarations[name];
    if (path) {
      const link = make("a");
      link.href = "https://github.com/nasqret/z-in-q-lean/blob/main/" + path;
      link.append(code);
      item.append(link);
    } else {
      item.append(code);
    }
    names.append(item);
  }
  panel.append(details);
}

function display(rowsToShow, id) {
  const list = element("list");
  list.replaceChildren();
  element("count").textContent = rowsToShow.length + " of " + rows.size + " statements";
  for (const row of rowsToShow) {
    const button = rowButton(row, states[row.state]);
    button.setAttribute("aria-current", row.id === id ? "true" : "false");
    list.append(button);
  }
  selectedId = id;
  showDetail(rows.get(id));
}

function navigate(id, addToHistory = false) {
  let visible = matchingRows();
  if (rows.has(id) && !visible.some(row => row.id === id)) {
    for (const filter of ["query", "route", "state"]) element(filter).value = "";
    visible = data.packages;
  }
  const target = visible.find(row => row.id === id) || visible[0];
  display(visible, target?.id);
  const hash = target ? "#" + target.id : "";
  if (location.hash !== hash) {
    const url = new URL(location.href);
    url.hash = hash;
    if (addToHistory) history.pushState(null, "", url);
    else history.replaceState(null, "", url);
  }
}

function filterChanged() {
  const visible = matchingRows();
  const target = visible.find(row => row.id === selectedId) || visible[0];
  navigate(target?.id);
}
for (const filter of ["query", "route", "state"]) {
  element(filter).addEventListener("input", filterChanged);
}
window.addEventListener("hashchange", () => navigate(location.hash.slice(1)));
navigate(location.hash.slice(1) || "bounded-from-tian-and-rank");
</script></body></html>
