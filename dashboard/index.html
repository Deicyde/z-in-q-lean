dicands are explicit products of four contact factors.","needs":["branch-coordinate-height"],"headers":["ZInQBlueprint.BranchHeight.three_quadratics","ZInQBlueprint.BranchHeight.factor_discriminants","ZInQBlueprint.BranchHeight.weightField_degree_three_quadratics","ZInQBlueprint.BranchHeight.degree_eight_height","ZInQBlueprint.BranchHeight.rootClasses_even"]},{"id":"branch-unit-obstruction","title":"Failure of the S-unit condition for the branch ratios","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"At u = p² for each prime p > 5, every ordering and every p-adic place has a normalized branch coordinate of absolute value different from one. Each finite base set admits such a prime outside both that set and the odd contact support.","needs":["branch-quadratic-fields"],"headers":["ZInQBlueprint.BranchHeight.UnitObstruction.nonunit_of_invariant","ZInQBlueprint.BranchHeight.UnitObstruction.uniform_valuations","ZInQBlueprint.BranchHeight.UnitObstruction.uniform_paper_nonunit","ZInQBlueprint.BranchHeight.UnitObstruction.finite_set_counterexample","ZInQBlueprint.BranchHeight.UnitObstruction.public_conductor_counterexample"]},{"id":"branch-contact-bound","title":"Uniform height bound in the intrinsic branch field","chapter":"Six-contact height","routes":["Bounded existence"],"state":"typed","claim":"For every unmarked rational parameter one ordering of the untwisted sextic must have h(B) ≤ 2²⁶ max(1, 6²⁸⁸ N_T²⁴). The field of the tuple has degree at most eight.","needs":["branch-quadratic-fields","partition-depth","height-field-extension","arch-place-bound","intrinsic-finite-places","intrinsic-branch-height"],"headers":["ZInQBlueprint.BranchHeight.CanonicalBranchBound","ZInQBlueprint.BranchHeight.UntwistedBranchHeight","ZInQBlueprint.BranchHeight.untwisted_of_canonical","ZInQBlueprint.BranchHeight.canonical_bound_iff_degree_eight"]},{"id":"odd-divisor-traces","title":"Quadratic genus characters on the odd class-group rows","chapter":"Class numbers and rational rank","routes":["Bounded existence"],"state":"kernel","claim":"Integral character orthogonality and the triangular divisor recurrence imply rational minus-descent. The trace field is needed only at divisors in classes five and seven. Clearing finitely many torsion differences yields the point used by the rank criterion.","needs":["class-five-recurrence","gaussian-torsion"],"headers":["ZInQBlueprint.TYZ.Specialization.represents_iff_multiple","ZInQBlueprint.TYZ.Specialization.primitive_trace_of_factors","ZInQBlueprint.TYZ.Specialization.representative_of_expansion","ZInQBlueprint.TYZ.Specialization.OddRowTraces","ZInQBlueprint.TYZ.Specialization.rank_of_divisor_traces"]},{"id":"merged-branch-theorem","title":"The branch criterion at the merged public theorem","chapter":"Class numbers and rational rank","routes":["Bounded existence"],"state":"kernel","claim":"The branch-coordinate inequality implies the exact public JHeightBound at a5937595. It combines with the four public analytic assumptions or the Proposition N variant. The divisor-local route instead uses its specified CM assumptions.","needs":["branch-coordinate-height","odd-divisor-traces"],"headers":["ZInQBlueprint.BranchHeight.public_jHeight_of_branchHeight","ZInQBlueprint.BranchHeight.frozen_of_branchHeight_and_literature","ZInQBlueprint.BranchHeight.frozen_of_branchHeight_and_TYZInputs","ZInQBlueprint.BranchHeight.frozen_of_canonical_height_and_odd_rows"]},{"id":"sextic-completion","title":"The smooth proper completion over the local field","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The literal base change of the paper curve to Q_p is uniquely isomorphic to the explicit two-chart completion of the DDMM polynomial over the specified open. The proof includes the reciprocal chart of degree five.","needs":["sextic-geometry"],"headers":["ZInQBlueprint.BinaryCover.unique_ddmm_completion","ZInQBlueprint.BinaryCover.unique_reglued_baseChange","ZInQBlueprint.BinaryCover.sexticCompletion_geometry","ZInQBlueprint.BinaryCover.ddmm_smooth_completion_iso"]},{"id":"height-field-extension","title":"Field independence of the projective height","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"Normalized projective height is preserved by field extension. A fixed labelled period bounds the intrinsic branch height with coefficient eight.","needs":["branch-coordinate-height"],"headers":["ZInQBlueprint.HeightDescent.normalizedHeight_map","ZInQBlueprint.BranchHeight.canonical_iff_bounded","ZInQBlueprint.BranchHeight.canonical_of_fixedPeriods","ZInQBlueprint.BranchHeight.period_intrinsic_height"]},{"id":"contact-invariant-orders","title":"The rational invariant at contacts and poles","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"For a primitive rational parameter and p>5, v(J)=2v(F)−6v(G). The ten weights divided by their sum have sum one and product (J/3779136)². Their relative orders and this product determine each order.","needs":["branch-coordinate-height","branch-quadratic-fields"],"headers":["ZInQBlueprint.ContactInvariant.rational_orders","ZInQBlueprint.ContactInvariant.cluster_orders","ZInQBlueprint.ContactInvariant.sumWeights_equations","ZInQBlueprint.ContactInvariant.orders_of_raw_gap"]},{"id":"partition-depth","title":"The ten weights on the local splitting charts","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"At p≥17 the weights divided by their sum have nine orders zero and one order 8d at an even contact of order 2d. At a pole of order g the orders are −2g nine times and 6g once. Each ordering on the local chart gives this multiset. The sum of the pole terms is at most 2 log(3907)+4h(u).","needs":["contact-invariant-orders","primitive-local-roots","sextic-branch-weights"],"headers":["ZInQBlueprint.BranchDepth.orders","ZInQBlueprint.BranchDepth.projective_branch_ratio","ZInQBlueprint.BranchDepth.integral_weight_sum","ZInQBlueprint.BranchDepth.fibre_weight_sum","ZInQBlueprint.BranchDepth.normalized_mobius","ZInQBlueprint.BranchDepth.even_normalized","ZInQBlueprint.BranchDepth.pole_normalized","ZInQBlueprint.BranchDepth.pole_exponent","ZInQBlueprint.BranchDepth.pole_form_height","ZInQBlueprint.BranchDepth.pole_sum_height"]},{"id":"projective-sextic-embedding","title":"The sextic as a closed curve in projective four-space","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"Four quadrics cut out the smooth completion of a separable sextic of degree six in characteristic zero. For the paper curve the identification over the field fixes the given finite chart.","needs":["sextic-completion","sextic-sheaf-cohomology"],"headers":["ZInQBlueprint.SexticEmbedding.two_standard_opens","ZInQBlueprint.SexticEmbedding.completion_is_quadrics","ZInQBlueprint.SexticEmbedding.paper_is_quadrics","ZInQBlueprint.SexticEmbedding.paperEmbedding_closed","ZInQBlueprint.SexticEmbedding.paperEmbedding_finite"]},{"id":"odd-row-cm","title":"Four-torsion on the odd CM trace rows","chapter":"Class numbers and rational rank","routes":["Bounded existence"],"state":"kernel","claim":"Over a field containing i, omission of √2 bounds the two-primary torsion on y²=x³+4x by the Gaussian kernel. Multiplication by the odd part of a hypothetical torsion order preserves the nonzero cusp trace.","needs":["odd-divisor-traces"],"headers":["ZInQBlueprint.TYZ.Specialization.TraceAction.sqrtTwo_not_mem_iff_four","ZInQBlueprint.TYZ.Specialization.rank_of_cm_odd_rows","ZInQBlueprint.TYZ.Specialization.divisorField_iff_Galois_action","ZInQBlueprint.TYZ.Specialization.rank_of_compositum_omitting_sqrtTwo"]},{"id":"conditional-cm-endpoint","title":"Bounded polynomial existence from branch heights and CM rows","chapter":"Class numbers and rational rank","routes":["Bounded existence"],"state":"kernel","claim":"The intrinsic branch bound or fixed labelled periods, together with the recurrence data, base normalization, class-three period congruences and the specified odd CM rows, gives the merged bounded-existence theorem.","needs":["height-field-extension","odd-row-cm"],"headers":["ZInQBlueprint.BranchHeight.frozen_of_canonical_height_and_cm_rows","ZInQBlueprint.BranchHeight.frozen_of_fixed_periods_and_cm_rows"]},{"id":"arch-place-bound","title":"A uniform bound at the infinite places","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The degree-normalized logarithm of the entire infinite-place factor of the sum-normalized ten branch weights is less than 49 for the paper sextic, in each number field containing its six roots. The estimate is uniform in the rational parameter and the nonzero twist.","needs":["partition-depth","height-field-extension"],"headers":["ZInQBlueprint.BranchDepth.infinite_factor_bound","ZInQBlueprint.BranchDepth.normalized_arch_log_lt","ZInQBlueprint.BranchDepth.log_archBound_lt"]},{"id":"intrinsic-finite-places","title":"The local chart at an embedding of the intrinsic field","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"Every embedding of the intrinsic field of branch ratios into an algebraic closure of Q_p sees the same ten absolute values. At positive even contact its local maximum is one and at a pole of order g it is p^(2g), for p≥17. The intrinsic Mathlib finite place w above p satisfies |q_i|_w=w(p)^e_i with the same exponents and its own place normalization. The exact maximum used in the Weil height is one at even contacts and w(p)^(−2g) at poles.","needs":["partition-depth","contact-invariant-orders"],"headers":["ZInQBlueprint.BranchPlaces.embedded_branches","ZInQBlueprint.BranchPlaces.at_chart","ZInQBlueprint.BranchPlaces.contact_at_embedding","ZInQBlueprint.BranchPlaces.pole_at_embedding","ZInQBlueprint.BranchPlaces.map_to_completion","ZInQBlueprint.BranchPlaces.finite_place_profiles","ZInQBlueprint.BranchPlaces.finite_place_suprema"]},{"id":"finite-weight-denominator","title":"All finite places of the intrinsic branch field","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"At each finite place the ten normalized coordinates are bounded by the inverse norm of 8503056 times the sixth power of the pole norm. The supremum is exactly one above p not dividing 6G.","needs":["intrinsic-finite-places"],"headers":["ZInQBlueprint.NonarchContact.finite_place_bound","ZInQBlueprint.NonarchContact.supremum_away"]},{"id":"intrinsic-branch-height","title":"The height of the branch point in terms of the pole form","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"For every unmarked rational u, nonzero twist, and labeling of the sextic roots, h(B) is less than 49+log(8503056)+6log G(u) and less than 115+12h(u).","needs":["finite-weight-denominator","arch-place-bound","height-field-extension"],"headers":["ZInQBlueprint.BranchDepth.paper_branch_height","ZInQBlueprint.BranchDepth.paper_branch_height_input","ZInQBlueprint.BranchDepth.exists_paper_branch_height"]},{"id":"odd-cm-radicals","title":"Square roots in the odd CM compositum","chapter":"Class numbers and rational rank","routes":["Bounded existence"],"state":"kernel","claim":"For squarefree n, omission of the square root of two from the genus compositum is equivalent to exclusion of the roots of 2d for all d dividing n from the extended field with i. For odd n the bare radical field omits the square root of two.","needs":["odd-row-cm"],"headers":["ZInQBlueprint.TYZ.Specialization.sqrtTwo_not_mem_radicalField","ZInQBlueprint.TYZ.Specialization.sqrtTwo_not_mem_genusCompositum_iff","ZInQBlueprint.TYZ.Specialization.two_three_mod_four_primes_of_odd_row","ZInQBlueprint.TYZ.Dyadic.local_quadratic_field"]},{"id":"sun28-estimates","title":"Two height contradictions and the fixed multiplier","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"With the compilation, completeness and height premises, the rational zero projection of a polynomial in 29 variables equals the integers. A fixed multiplier is given as a function of the three real height constants.","needs":[],"headers":["Sun28.multiplier_spec","Sun28.ordinary_cutoff","Sun28.integral_input","Sun28.scalar_leaf_costs","Sun28.projection_of_estimates"]},{"id":"sun28-reciprocal","title":"A guarded nonzero rational root in one variable","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"For coefficient lists of arbitrary length, the reciprocal equation has a rational zero exactly when both guards are nonzero and the retained monic polynomial has a nonzero rational root. Two fixed shifts cover zero roots.","needs":[],"headers":["Sun28.Projection.guard_zero","Sun28.Projection.reciprocal_identity","Sun28.Projection.reciprocal_projection","Sun28.Projection.shift_for_nonzero_root"]},{"id":"sun28-specialization","title":"Exact finite branches at the fixed preparation data","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"For the fixed data a single finite list recognizes the exact checked point relation at each of the 28 base coordinates. Its integer polynomial has the input and 28 rational witnesses. The integer projection still assumes simultaneous arithmetic witnesses, the residual height, the published S-unit bound and the ordinary chart.","needs":["sun28-concrete-atlas"],"headers":["Sun28.Concrete.fixed_exact"]},{"id":"sun28-ordinary","title":"Global height in the forward direction","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"typed","claim":"The ordinary and scalar logarithmic estimates are proved on the specified curve. To infer integrality for every accepted input, the remaining specialized hypothesis is the five-mark height on the strict failure set of the least conductor test.","needs":["sun28-points-forward","sun28-original-five-height","sun28-local-logarithm"],"headers":["Sun28.MinimalConductors.ExactLeastHeight","Sun28.PreparedPoles.integral_of_root"]},{"id":"sun28-joint","title":"Integer witnesses from prime tuples and paired twist points","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"typed","claim":"The restricted primes and prescribed rational points on the transposed-quartic residual yield the integer fibres of the fixed polynomial.","needs":["sun28-prime-pattern","sun28-residual-twists","sun28-elliptic-real-model"],"headers":["Sun28.WitnessHeight.fibre_of_transfer","Sun28.PrimeTransfer.hybrid_of_interior","Sun28.GlobalDescent.sections_iff_transposed_residual"]},{"id":"sun28-definition","title":"Sun’s theorem on the ordinary integers","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"typed","claim":"Sun’s fixed polynomial defines the integers assuming the pointwise scalar bound at surviving exceptional inputs, the ordinary bound off two explicit tests, the published inputs, the prime estimates and prescribed points. On concentrated inputs two explicit denominator barriers further restrict the conic cases.","needs":["sun28-weighted-projection","sun28-remaining-point-height","sun28-joint"],"headers":["Sun28.IntegerDefinition28","Sun28.ScalarDepth.projection_of_exceptions"]},{"id":"sun28-square","title":"The four quadratic-field square-root charts","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"Each signed square root of a+b√2 occurs on one of the four rational charts. The two components of the actual elliptic cubic give the stated ordinate equations.","needs":[],"headers":["Sun28.Ordinates.four_charts","Sun28.Ordinates.ordinate_charts"]},{"id":"sun28-fiber","title":"Rational points in one specialized triangular system","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"For 26 triangular coordinates of total degree at most 2^44 there is a rational monic locator with the same rational solvability, including repeated roots.","needs":[],"headers":["ZInQBlueprint.SunTower.Tower.sun_projection_budget","ZInQBlueprint.SunTower.exists_bounded_separator","ZInQBlueprint.SunTower.Tower.exists_filtered_projection"]},{"id":"sun28-resultants","title":"A monic polynomial before specialization","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"Iterated Sylvester resultants compute the image polynomial over the parameter ring. Over a domain it is monic of the product degree. After specialization its factors include every tuple with multiplicity.","needs":["sun28-fiber"],"headers":["ZInQBlueprint.SunResultant.ParamTower.imagePolynomial_map","ZInQBlueprint.SunResultant.ParamTower.imagePolynomial_monic","ZInQBlueprint.SunResultant.ParamTower.imagePolynomial_natDegree","ZInQBlueprint.SunResultant.ParamTower.finite_guard_samples","ZInQBlueprint.SunResultant.ParamTower.rational_locator_at"]},{"id":"sun28-separator","title":"Selecting a separating form by determinant coefficients","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The order of the shifted resultant counts ordered pairs with coinciding images, weighted by root multiplicities. A bounded coefficient test selects exactly the injective forms.","needs":["sun28-fiber"],"headers":["Sun28.Collision.separates_iff_coefficient_branch","Sun28.Collision.resultant_coefficient","Sun28.Guard.isRoot_map_keep"]},{"id":"sun28-polynomial-charts","title":"Polynomial equations and inequations at a single root","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"For a monic root equation and two finite test lists there is one integer polynomial, fixed before specialization, using a single rational witness. A second endpoint places that witness in the 29-variable signature.","needs":["sun28-reciprocal","sun28-estimates"],"headers":["Sun28.Branches.polynomial_for_tests","Sun28.Branches.polynomial28_spec","Sun28.Branches.integerDefinition28_of_charts","Sun28.Mask.rational_specialization"]},{"id":"sun28-trace-local","title":"One place witnesses both orders","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The normalized quadratic trace forces test orders at least 1 and 48 at the same place above an odd prime. Preparation implies the dyadic congruence and a real bound.","needs":[],"headers":["Sun28.ScalarTrace.unramified_two_tests","Sun28.ScalarTrace.dyadic_scalarTheta","Sun28.ScalarTrace.real_scalarTheta_bounds","Sun28.ScalarTrace.prime_order_rat"]},{"id":"sun28-scalar-index","title":"Divisibility on the actual elliptic generator","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The two scalar tests, an odd rational contact, the contact unit and the pole bound imply p^48 divides s−1. The point is the displayed generator on Sun’s curve. Infinite order and formal comparison are hypotheses.","needs":["sun28-trace-local"],"headers":["Sun28.Scalar.odd_prime_scalar48","Sun28.Scalar.published_scalar48","Sun28.Scalar.double_parameter"]},{"id":"sun28-uniform","title":"Uniform projection of tested triangular systems","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"From any finite list of monic triangular systems with polynomial zero and nonzero tests, construct one integer polynomial before all rational specializations. For 27 free rational witnesses, the result has exactly 28 witness slots and one input.","needs":["sun28-resultants","sun28-separator","sun28-polynomial-charts"],"headers":["Sun28.Compiler.polynomial_for_tower","Sun28.Compiler.eval28_iff","Sun28.Compiler.integerDefinition28_of_branches"]},{"id":"sun28-generator-depth","title":"Infinite order by dyadic doubling","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"On the displayed generator the reciprocal abscissa has dyadic order 3v(2). Each doubling increases parameter order by v(2). Thus the generator has infinite order and the odd-prime divisibility implication only needs formal comparison and the scalar contact hypotheses.","needs":["sun28-scalar-index"],"headers":["Sun28.Scalar.double_dyadic_depth","Sun28.Scalar.paperGenerator_infinite","Sun28.Scalar.odd_prime_scalar48_of_formalComparison"]},{"id":"sun28-integral-square","title":"Integer-monic encoding of a signed square root","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"A quadratic-field square root whose two coefficients share a guarded parameter denominator has a four-branch encoding by a single root of a monic integer-coefficient polynomial. The chart reconstructs the chosen sign.","needs":["sun28-square"],"headers":["Sun28.RootCharts.square_iff_root","Sun28.RootCharts.stage_square_iff","Sun28.RootCharts.curve_iff_root","Sun28.RootCharts.polynomial_monic"]},{"id":"pole-norm-height","title":"Exact modular height and sharp parameter comparison","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"For t=5+120/u=p/q and u nonzero, the reduced denominator of the public modular function is D^6, where D=(p²+3q²)/(e₂e₃). Thus h(J)=6 log D and 12h(u)≤h(J)+6 log 14400. A primitive family attains the limiting ratio 14400.","needs":[],"headers":["ZInQBlueprint.PoleNorm.denominatorRoot","ZInQBlueprint.PoleNorm.j_denominator","ZInQBlueprint.PoleNorm.j_height_exact","ZInQBlueprint.PoleNorm.jHeight_iff_denominator","ZInQBlueprint.PoleNorm.height_square_le","ZInQBlueprint.PoleNorm.sharp_parameter_height","ZInQBlueprint.PoleNorm.test_height_ratio","ZInQBlueprint.PoleNorm.frozen_of_denominator_and_literature"]},{"id":"uniform-twist-point-height","title":"The six-contact height beyond the twenty unit equations","chapter":"Six-contact ’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The two inputs of integer-only soundness are the scalar octic and the largest ordinary height with the ramified primes of three at most biquadratic fields. The global five-mark estimate implies the two local requirements.","needs":["sun28-certificate-bounds","sun28-field-height","sun28-transposed"],"headers":["Sun28.WitnessHeight.integral_of_field_height","Sun28.WitnessHeight.field_projection","Sun28.WitnessHeight.ordinary_coordinates","Sun28.WitnessHeight.integral_of_two_loci","Sun28.WitnessHeight.two_loci_projection","Sun28.WitnessHeight.ordinary_field_primes","Sun28.WitnessHeight.two_loci_of_uniform","Sun28.WitnessHeight.scalar_field_primes"]},{"id":"sun28-ordinary-projection","title":"The fixed polynomial from the two curve estimates, prime models and a transposed quartic","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"For Sun’s literal integer polynomial the forward implication uses the two height estimates. The reverse implication follows from the real elliptic and quadric theorems, finite recurrence, fixed-class density, ordinary-prime transference, relative upper moments and the prescribed-point assertion.","needs":["sun28-two-curves","sun28-ordinary-model","sun28-transposed"],"headers":["Sun28.WitnessHeight.fibre_of_transfer","Sun28.WitnessHeight.transfer_projection","Sun28.WitnessHeight.ordinary_projection"]},{"id":"sun28-two-locus-height","title":"The two remaining height bounds on rational polynomial certificates","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"typed","claim":"Bound the scalar octic height and one largest ordinary height with the union of the field-discriminant supports for each accepted tuple with nonintegral input. A uniform field-height bound also suffices.","needs":["sun28-two-curves","sun28-field-height"],"headers":["Sun28.WitnessHeight.TwoLocusHeight","Sun28.WitnessHeight.two_loci_of_uniform","Sun28.WitnessHeight.integral_of_two_loci","Sun28.FiveDescent.ResidueField.FieldHeight"]},{"id":"sun28-lucas-allowance","title":"The signed Lucas power and the scalar height allowance","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"When the Lucas equation holds, the second coordinate has log absolute value at least (c/4) log c for c=|s−1|≥12. With L=lcm(M,R⁴⁸), either H*R²⁴ or 2R⁴⁸ log R is at most L log L/24.","needs":["sun28-scalar-octic","sun28-index-soundness"],"headers":["Sun28.ScalarLucas.lucas_coordinate_growth","Sun28.ScalarLucas.scalar_lucas_growth","Sun28.ScalarLucas.multiplier_reserve","Sun28.ScalarLucas.radical_pos","Sun28.ScalarLucas.stepFloor_dvd","Sun28.ScalarLucas.stepFloor_bounds","Sun28.ScalarLucas.fixed_reserve","Sun28.ScalarLucas.log_one_of_floor","Sun28.ScalarLucas.allowance_comparison","Sun28.ScalarLucas.original_fits","Sun28.ScalarLucas.high_power_fits"]},{"id":"sun28-allowance-criteria","title":"The scalar denominator and the least unit conductor","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The signed Lucas comparison implies integrality at the enlarged scalar bound and the old largest ordinary slope. The integral Pell estimate and the least unit conductor give two explicit tests sufficient at each input.","needs":["sun28-lucas-allowance","sun28-two-curves"],"headers":["Sun28.ScalarLucas.integral_of_allowance","Sun28.ScalarLucas.integral_of_allowance_height","Sun28.ScalarLucas.allowance_of_two_loci","Sun28.ScalarLucas.allowance_projection","Sun28.ScalarLucas.scalar_denominator_estimate","Sun28.ScalarLucas.scalar_after_tests"]},{"id":"sun28-ordinary-indices","title":"The two ordinary index tests","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The first comparison involves only three indices and forces the Lucas discrepancy to vanish. On its zero locus y of the same pair at several small moduli excludes d=1, −1 and 13.","needs":["sun28-octic-quotients"],"headers":["Sun28.ScalarQuotients.prime_divides_determinant","Sun28.ScalarQuotients.squarefree_factor","Sun28.ScalarQuotients.two_kernels","Sun28.ScalarQuotients.mem_localPairs","Sun28.ScalarQuotients.no_affine_point","Sun28.ScalarQuotients.excluded_classes"]},{"id":"sun28-inert-twists","title":"An infinite family of empty twists of the scalar octic","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"There is no affine nonbranch rational point when the signed squarefree twist d is odd, is 1 modulo 3, and every prime dividing |d| is odd and makes both −1 and −6 nonsquares.","needs":["sun28-two-squareclasses"],"headers":["Sun28.ScalarQuotients.inert_twists_excluded"]},{"id":"sun28-index-projection","title":"The polynomial implication using ordinary indices","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The two ordinary index tests and the scalar height on the inputs surviving the effective estimates imply integrality of a zero of the literal fixed polynomial.","needs":["sun28-allowance-criteria","sun28-ordinary-indices","sun28-numerator-pencil"],"headers":["Sun28.ScalarLucas.integral_of_indices","Sun28.ScalarLucas.remainder_of_pencil","Sun28.ScalarLucas.index_projection"]},{"id":"sun28-scalar-support-progression","title":"A residue class of primes excluded from every scalar twist","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"Every odd prime of a represented scalar square class must make one of −6, −1, 1199 and −439 a square. The primes congruent to 10304207 modulo 12632664 divide none. For each finite set of them the fraction of represented residues is bounded by the Euler product.","needs":["sun28-scalar-octic","sun28-inert-twists"],"headers":["Sun28.ScalarQuotients.splitting_at_prime","Sun28.ScalarQuotients.progression_excluded","Sun28.ScalarQuotients.finite_residue_bound","Sun28.ScalarQuotients.finite_density_bound"]},{"id":"sun28-point-projection","title":"The fixed polynomial after the scalar twist exclusions","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The scalar hypothesis only concerns rational points on unexcluded signed squarefree twists that survive the three effective tests and the elementary conic test. The ordinary, prime and prescribed-point inputs are explicit in the two-direction theorem.","needs":["sun28-index-projection","sun28-scalar-support-progression","sun28-inert-twists","sun28-pythagorean"],"headers":["Sun28.ScalarLucas.scalar_of_remaining_points","Sun28.ScalarLucas.fixed_projection"]},{"id":"glazer-scalar-comparison","title":"The order-48 scalar comparison in Glazer’s earlier arithmetic interpretation","chapter":"Glazer’s fixed construction","routes":["Fixed construction"],"state":"kernel","claim":"At β=x²+2, the anchor A≤|s| and R⁴⁸ dividing |s| allow h(β)≤V log V with V=max(A,R⁴⁸). The manuscript’s bound on the ordinary indices and the zero Lucas equation then imply x is an integer, with coefficients 8/13 and 3/13 retained.","needs":["sun28-lucas-allowance","sun28-ordinary-indices"],"headers":["GlazerScalar.growth_at_abs","GlazerScalar.scalar_separation","GlazerScalar.numerator_log","GlazerScalar.scalar_of_index_bound"]},{"id":"glazer-scalar32","title":"The order-32 scalar comparison in the fixed source","chapter":"Glazer’s fixed construction","routes":["Fixed construction"],"state":"kernel","claim":"For the later fixed rational source, the scalar radical has order 32 and the numerator exponent is 3/2. The manuscript’s ordinary index inequality gives integrality as soon as the scalar height is at most L log L/24 for the lcm L of the physical anchor divisor and R³².","needs":["glazer-scalar-comparison"],"headers":["GlazerScalar.numerator_log32","GlazerScalar.scalar32_of_index_bound"]},{"id": uction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"kernel","claim":"Assuming the specified numerical unit-height bound from section 8 of Murty and Pasten, the slope height is below (24/5)n log n+14n+57 for the smallest of the ten actual supports.","needs":["sun28-least-conductor"],"headers":["ZInQBlueprint.FiveCovers.chart_height","ZInQBlueprint.FiveCovers.least_chart_height","ZInQBlueprint.FiveCovers.original_iff_chart","ZInQBlueprint.FiveCovers.MurtyPastenEstimate","ZInQBlueprint.FiveCovers.RemainingChartHeight"]},{"id":"glazer-conic-count","title":"Counting primitive directions on three diagonal conics","chapter":"Glazer’s fixed construction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"kernel","claim":"Three marked rows give integral directions on a conic in three real sign ranges. Every ordered coefficient triple contributes at most 18(floor(sqrt(2X))+1) slopes in the box. The product budget costs two harmonic sums.","needs":["glazer-five-input-density"],"headers":["ZInQBlueprint.SplitRows.Arc.parametrization","ZInQBlueprint.SplitRows.arc_volume","ZInQBlueprint.SplitRows.lattice_volume","ZInQBlueprint.SplitRows.three_in_cell","ZInQBlueprint.SplitRows.value_injective","ZInQBlueprint.SplitRows.Record.recover_arc","ZInQBlueprint.SplitRows.Record.arc_bound","ZInQBlueprint.SplitRows.record_of_rows","ZInQBlueprint.SplitRows.record_at_failure","ZInQBlueprint.SplitRows.same_code","ZInQBlueprint.SplitRows.count_with_triples","ZInQBlueprint.SplitRows.exception_count","ZInQBlueprint.SplitRows.mem_productTriples","ZInQBlueprint.SplitRows.productTriples_card","ZInQBlueprint.SplitRows.count_with_product"]},{"id":"glazer-split-height","title":"A pointwise bound from two matching squareclasses","chapter":"Glazer’s fixed construction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"kernel","claim":"When two scaled rows have the same signed squareclass, subtraction of squares bounds the slope height by twice the logarithm of the gue"]},{"id":"glazer-two-elliptic-images","title":"Two rational elliptic images and the exact lift test","chapter":"Glazer’s fixed construction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"kernel","claim":"The marked slope gives genuine affine elliptic group points on the two genus-two quotients twisted by e and de. A nonbranch point on the first cubic lifts if and only if its abscissa is d times a rational square.","needs":["sun28-five-mark-sextic"],"headers":["ZInQBlueprint.TwoEllipticMaps.reciprocal","ZInQBlueprint.TwoEllipticMaps.cubic_coefficients","ZInQBlueprint.TwoEllipticMaps.cubic_point","ZInQBlueprint.TwoEllipticMaps.two_images","ZInQBlueprint.TwoEllipticMaps.lift_iff","ZInQBlueprint.TwoEllipticMaps.images_of_slope"]},{"id":"glazer-five-infinite-orders","title":"Infinite-order images on all five elliptic quotients","chapter":"Glazer’s fixed construction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"kernel","claim":"Every unmarked slope of logarithmic height above 80 gives only infinite-order points at the specified normalized abscissas on all five quartic twists. In particular this holds at every strict failure of the five-contact estimate. Explicit duplication and ten homogeneous Bézout identities suffice.","needs":["glazer-five-quotient","glazer-concentrated-twists"],"headers":["ZInQBlueprint.MarkedTorsion.represents_double","ZInQBlueprint.MarkedTorsion.cross","ZInQBlueprint.MarkedTorsion.exponent_test","ZInQBlueprint.MarkedTorsion.primitive_root","ZInQBlueprint.MarkedTorsion.rational_root","ZInQBlueprint.MarkedTorsion.monic_chart","ZInQBlueprint.MarkedTorsion.represented_point","ZInQBlueprint.MarkedTorsion.translated_height","ZInQBlueprint.MarkedTorsion.bounded_abscissa","ZInQBlueprint.MarkedTorsion.five_infinite_orders","ZInQBlueprint.MarkedTorsion.bezout_relations","ZInQBlueprint.MarkedTorsion.cofactor_bounds","ZInQBlueprint.MarkedTorsion.primitive_proportional","ZInQBlueprint.MarkedTorsion.primitive_growth","ZInQBlu Truncation.centered_mean_zero","Sun28.CubeTruncation.centered_window_error","Sun28.CubeTruncation.centered_window_transfer","Sun28.CubeTruncation.window_bounds","Sun28.CubeTruncation.window_zero"]},{"id":"pole-rational-menus","title":"Thinness of a finite menu of rational point formulas","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"For a fixed finite menu of rational abscissa formulas the exceptional parameters are finite or arise from nonsquare double covers. The published Cohen bound gives O(√N log N) successes along an explicit class-prepared progression.","needs":["pole-four-menus"],"headers":["Sun28.PointConstruction.fractional_progression","Sun28.PointConstruction.menu_thin","Sun28.PointConstruction.prepared_menu_bound"]},{"id":"pole-positive-seed","title":"One point on a positive twist of the prescribed pair","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The second elliptic curve has an explicit nonzero ordinate for the positive auxiliary 267706460779. The first marked quartic characterizes whether that twist supplies both points.","needs":["pole-four-menus"],"headers":["Sun28.PointConstruction.positive_factors","Sun28.PointConstruction.positive_quartic","Sun28.PointConstruction.positive_second_nonzero_ordinate","Sun28.PointConstruction.positive_pair_iff"]},{"id":"five-global-determinant","title":"The determinant of the scalar twist","chapter":"Glazer’s fixed construction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"kernel","claim":"If the product of the determinant and the square character is quadratic, the determinant has order at most twice the exponent of the square character.","needs":["five-sign-splitting"],"headers":["ZInQBlueprint.DiamondHeight.determinant_from_square","ZInQBlueprint.DiamondHeight.determinant_at_sign_field"]},{"id":"five-multiplicity-17","title":"The multiplicity estimate at exponent seventeen","chapter":"Glazer’s fixed construction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"kernel","claim":"If r copies split off over the field of comparison, t≤4r and the character order t satisfies the stated local bound, then h is at most 2^26 V₀^6 k^5 M^17.","needs":["five-height-eighteen","five-odd-cutoff"],"headers":["ZInQBlueprint.DiamondHeight.character_euler_fifth","ZInQBlueprint.DiamondHeight.repeated_surface_height","ZInQBlueprint.DiamondHeight.multiplicity_height17"]},{"id":"scalar-genus-quotient-height","title":"The height of a marked point on the scalar quotients","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"Every failure on a concentrated conic gives a rational point above the explicit height cutoff on one of two fixed genus-two curves. Its abscissa still satisfies the original marked equation.","needs":["scalar-conic-inverse"],"headers":["Sun28.ConicArithmetic.point_fits","Sun28.ConicArithmetic.failure_locus","Sun28.ConicArithmetic.scalar_of_quotient_exceptions"]},{"id":"scalar-octic-class","title":"The positive squareclass minus 231 is empty","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"No rational s>4 with s and 7(s−4) squares lies in the quadratic component −231. Two congruence tests at 32 and 27 suffice after the integral divisor reduction.","needs":["scalar-conic-inverse"],"headers":["Sun28.OcticResidues.negative231_excluded"]},{"id":"scalar-positive-selection","title":"The two squareclasses on the positive marked quintic","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"Every marked positive point has quadratic component in the classes −231 or −42. Norm factorization and the marked congruences at 8 and 7 give the exact two representatives.","needs":["scalar-conic-selection","scalar-conic-inverse"],"headers":["Sun28.ConicSelection.positive_selmer_selection","Sun28.ConicSelection.rational_representative"]},{"id":"scalar-selected-genus","title":"The scalar height from the surviving marked loci","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"Two-isogeny descent, odd good reduction, the positive class selection and the estimate on the selected exceptional locus imply the original scalar bound.","needs":["scalar-genus-quotient-height","scalar-octic-class","scalar-positive-selection"],"headers":["Sun28.ConicArithmetic.positive_selected","Sun28.ConicArithmetic.selected_failure_locus","Sun28.ConicArithmetic.scalar_of_selected_exceptions"]},{"id":"scalar-negative-residues","title":"Congruences on the original negative marked scalar","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"On the surviving negative quadratic component, the rational scalar has unit denominator at 17 and 19, and 36x²=289 in both residue fields.","needs":["scalar-conic-inverse"],"headers":["Sun28.ConicNegative.marked_residues","Sun28.ConicNegative.original_residues"]},{"id":"cm-fibre-degree","title":"Degree of the CM ring class field","chapter":"Glazer’s fixed construction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"kernel","claim":"The embeddings into the geometric fibre give degree at most sixteen. Shimura reciprocity identifies the class field with a compositum whose relative degree cannot increase.","needs":["five-diamond-application"],"headers":["ZInQBlueprint.CMPeriods.residue_degree_le","ZInQBlueprint.CMPeriods.ring_class_degree_le"]},{"id":"cm-order-conductor","title":"Conductors of the CM orders","chapter":"Glazer’s fixed construction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"kernel","claim":"Cox’s class-number formula and its exceptional unit factor give totient at most 48. Euler’s product then gives conductor at most 384.","needs":["cm-fibre-degree"],"headers":["ZInQBlueprint.CMPeriods.conductor_le","ZInQBlueprint.CMPeriods.totient_le_c 28.PrimeModel.left_quarter"]},{"id":"gaussian-aggregate-input","title":"Surviving weighted mass along common rows","chapter":"Sun’s 28-witness construction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"typed","claim":"For cofinal cutoffs the weighted base mass minus the total of the local upper moments must exceed δ_L NW on common rows, with δ_L L log L unbounded.","needs":["gaussian-landau"],"headers":["Sun28.PrimeModel.CofinalBonferroni"]},{"id":"gaussian-aggregate-transfer","title":"From aggregate losses to the simultaneous prime input","chapter":"Sun’s 28-witness construction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"kernel","claim":"The old individual first moments imply the aggregate criterion, and that criterion supplies the hybrid prime input.","needs":["gaussian-aggregate-input"],"headers":["Sun28.PrimeModel.bonferroni_of_moments","Sun28.PrimeModel.hybrid_of_bonferroni"]},{"id":"cm-aggregate-projection","title":"The two directions of the one-sign polynomial","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The inverse implication uses the marked geometry and the CM period calculation. The forward implication uses the cofinal sieve and simultaneous global sections.","needs":["cm-marked-projection","gaussian-aggregate-transfer","pole-joint-selected"],"headers":["ZInQBlueprint.CMPeriods.integer_fibre_of_aggregate","ZInQBlueprint.CMPeriods.one_sign_of_aggregate"]},{"id":"pair-marked-kummer","title":"The actual point group and signed covering equations","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"Every rational point, including all exceptional coordinates, supplies the signed quadratic covering and local classes at all places.","needs":["pole-four-menus"],"headers":["Sun28.SelmerRealization.rational_cover","Sun28.SelmerRealization.labels_cover","Sun28.SelmerRealization.cover_map","Sun28.SelmerRealization.labels_local"]} ["Fixed construction","Sun’s 28 witnesses"],"state":"kernel","claim":"A count on the actual inert norm fibres saves the classes discarded by the earlier sentinel. The local average of collisions has order at most p⁻⁴ in the distinct case.","needs":["gaussian-signed-selection"],"headers":["Sun28.CommonRows.exact_inert_average","Sun28.CommonRows.inert_average_bound","Sun28.CommonRows.power_difference"]},{"id":"gaussian-fixed-ray-recovery","title":"An actual recurrence row recovered by the signed tests","chapter":"Glazer’s fixed construction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"kernel","claim":"Narrow recurrence in a single ray with step divisible by p gives arbitrarily large original coefficient patterns rejected by the earlier test while both signed orders survive.","needs":["gaussian-inert-average"],"headers":["Sun28.CommonRows.fixed_norm_residue","Sun28.CommonRows.narrow_recovered"]},{"id":"gaussian-corrected-window","title":"A lower bound for the surviving Gaussian prime tuples","chapter":"Glazer’s fixed construction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"typed","claim":"Prove the explicit cofinal common-row inequality for the base mass minus single-place losses, with the allowed pairwise correction, for the thirteen prescribed prime values.","needs":["gaussian-aggregate-input","gaussian-signed-selection"],"headers":["Sun28.CommonRows.PairCorrectedInputs"]},{"id":"gaussian-corrected-surplus","title":"The corrected lower bound supplies positive surplus","chapter":"Glazer’s fixed construction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"kernel","claim":"Corrected lower mass and the independent upper estimate yield a common choice of ordinary parameters at the required surplus.","needs":["gaussian-corrected-window"],"headers":["Sun28.CommonRows.positive_surplus"]},{"id":"marked-kummer-separation","title":"Kummer separation on the cubic with roots 0, n and −3n","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The character map respects elliptic addition, including exceptional points. Explicit halving proves that its kernel is twice the rational point group for each positive twist.","needs":["pair-marked-kummer"],"headers":["Sun28.MarkedDescent.character_labels","Sun28.MarkedDescent.half_of_characters","Sun28.MarkedDescent.kummer_separation","Sun28.MarkedDescent.prepared_scalar"]},{"id":"marked-everywhere-local","title":"Everywhere local solubility of the fixed marked class","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"For (526361,1) the two-cover has points over the reals and every p-adic field. At all good odd primes a polynomial root count supplies a residue and Hensel lifting supplies a local point.","needs":["pair-fixed-second"],"headers":["Sun28.MarkedDescent.fixed_good_places","Sun28.MarkedDescent.fixed_membership"]},{"id":"marked-first-point","title":"The two outstanding inputs for the fixed pair","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"With Mordell–Weil finite generation, eight local classes and one rational point of infinite order on the first twist imply a scalar pole. The second twist has an explicit point.","needs":["marked-kummer-separation","marked-everywhere-local","pair-fixed-infinite"],"headers":["Sun28.MarkedDescent.finite_descent_iff_card","Sun28.MarkedDescent.prepared_scalar_of_card"]},{"id":"explicit-28-projection","title":"The polynomial and its three project-specific hypotheses","chapter":"Glazer’s fixed construction","routes":["Fixed construction","Sun’s 28 witnesses"],"state":"kernel","claim":"Evaluations on the actual marked fibres give integrality of every rational zero. A cofinal joint Gaussian estimate and simultaneous global points give a zero at every integer, together with the three stated literature inputs.","needs":["pencil-actual-fibres","gaussian-corrected-surplus ion","Sun28.QualitativeRows.selected_of_rational"]},{"id":"reduced-point-periods","title":"The orders of the reduced points suffice","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The order of each specified reduced point divides its curve cardinality. Its order suffices for the local trace, and a balanced signed graph of the smaller periods produces the required nine points.","needs":["rational-prime-selection"],"headers":["Sun28.QualitativeRows.balanced_of_dvd","Sun28.QualitativeRows.period_preparation","Sun28.QualitativeRows.point_of_rational","Sun28.QualitativeRows.selected_of_point"]},{"id":"seeded-pair","title":"Unbounded common multipliers for fixed squareclasses","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"For every admissible pair b,d and every bound there is a squarefree common multiplier giving the prescribed first cover a rational point and the companion a point everywhere locally. Both twists are eleven modulo twelve.","needs":["marked-kummer-separation","marked-everywhere-local"],"headers":["Sun28.SeededPartners.first_cover","Sun28.SeededPartners.seeded_pair"]},{"id":"seeded-small-places","title":"Uniform necessary conditions at the small places","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"For any twist congruent to eleven modulo twelve, squarefree everywhere locally soluble labels have positive first entry, both are odd and the second is one modulo three and a 3-adic square.","needs":["marked-small-image"],"headers":["Sun28.SeededPartners.seven_image","Sun28.SeededPartners.small_places"]},{"id":"seeded-companion-criterion","title":"A single companion point realizes the pair","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"A rational point on the marked companion of a candidate yields the required simultaneous pair. A companion with eight ’s 28 witnesses"],"state":"typed","claim":"For each integer, establish the existence of a prime tuple whose reduced point orders pass the signed cycle test in its selected window.","needs":["reduced-point-periods"],"headers":["Sun28.SeededPartners.integerWindow","Sun28.SeededPartners.one_sign_of_fixed_windows"]},{"id":"point-period-projection","title":"The polynomial theorem from three project-specific inputs","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The 28-witness polynomial cuts out the integers assuming the actual marked-fibre evaluations, a rational prime row in each integer window and one rational marked companion at each residual pair, with the stated classical inputs.","needs":["pencil-actual-fibres","cm-small-class-discriminants","point-row-existence","companion-lift"],"headers":["Sun28.SeededPartners.integer_of_point_periods","Sun28.SeededPartners.integerWindow","Sun28.SeededPartners.one_sign_of_point_periods","Sun28.SeededPartners.one_sign_of_fixed_windows"]},{"id":"uniform-marked-rank","title":"A proper marked factor gives an infinite-order point","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"When the twist is squarefree and the mark and complementary factor are both greater than one, an actual marked point supplies a rational point of infinite order and eight distinct rational classes modulo doubling. Every admissible pair has unbounded first twists with this marked point. On a companion with eight local classes, the marked cover is soluble exactly when the rational rank is positive, under Mordell–Weil finite generation.","needs":["seeded-pair","seeded-companion-criterion","fixed-rank-equivalence"],"headers":["Sun28.CompanionRank.candidate_first","Sun28.CompanionRank.candidate_companion","Sun28.CompanionRank.candidate_companion_iff","Sun28.CompanionRank.candidate_companion_iff_eight","Sun28.CompanionRank.unbounded_marked_rank"]},{"id":"ordered-family","title":"A prescribed ordered cover is an old quartic family","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"On a proper squarefree twist, a rational point on the ordered covering is equivalent to a nondegenerate point on the factorization quartic.","needs":["seeded-pair"],"headers":["Sun28.NormPartners.family_of_cover","Sun28.NormPartners.cover_of_family","Sun28.NormPartners.cover_iff_family"]},{"id":"ordered-residual","title":"The ordered companion forces a previously treated factorization","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"A full ordered companion for a seeded pair implies the excluded factorization. The universal ordered lifting premise is equivalent to absence of residual pairs.","needs":["ordered-family"],"headers":["Sun28.NormPartners.candidate_quartics","Sun28.NormPartners.cancelled_of_companion","Sun28.NormPartners.all_companions_fail","Sun28.NormPartners.companion_iff_no_residual"]},{"id":"weak-companion","title":"The polynomial only needs the abscissa squareclass","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"A rational point of the prescribed abscissa squareclass on one seeded companion per residual pair suffices for the polynomial theorem.","needs":["ordered-residual","point-period-projection"],"headers":["Sun28.NormPartners.cover_of_square_difference","Sun28.NormPartners.necessary_nonsquare","Sun28.NormPartners.companion_implies_weak","Sun28.NormPartners.sections_of_weak_companion","Sun28.NormPartners.integer_of_weak_companion","Sun28.NormPartners.one_sign_of_weak_companion"]},{"id":"weak-rank","title":"Every point of the prescribed proper abscissa class has infinite order","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"On a squarefree twist l=bk, b,k>1, every strict point with abscissa class b has infinite order.","needs":["weak-companion"],"headers":["Sun28.WeakRank.abscissa_torsion","Sun28.WeakRank.outside_torsion","Sun28.WeakRank.affine_infinite","Sun28.WeakRank.strict_point_rank"]},{"id":"weak-local-size","title":"At least twelve local classes on a successful residual twist","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"Four rationally insoluble locally soluble classes and eight rational classes force at least twelve local classes on a genuinely uncancelled successful companion.","needs":["weak-rank"],"headers":["Sun28.WeakRank.finite_local_labels","Sun28.WeakRank.uncancelled_local_bound","Sun28.WeakRank.sixteen_of_power_of_two"]},{"id":"weak-primary-size","title":"The local count under the primary comparison","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The primary comparison and Mordell–Weil finite generation raise the lower bound from twelve to sixteen.","needs":["weak-local-size"],"headers":["Sun28.WeakRank.local_power","Sun28.WeakRank.sixteen_of_primary"]},{"id":"weak-seed-example","title":"A successful pair of abscissas at multiplier 19","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"Lean verifies the two required rational points for (17,457,19). The Magma supplement gives a pairing obstruction to the ordered companion on this same seed.","needs":["weak-companion"],"headers":["Sun28.WeakRank.admissible_17_457","Sun28.WeakRank.seeded_weak_17_457","Sun28.WeakRank.seeded_pair_points"]},{"id":"abscissa-divisor","title":"Descent by the squarefree part of x minus l","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The free coordinate of a strict point is a positive divisor m of l, with m equal to one modulo three. The corresponding intersection of quadrics recovers a strict point.","needs":["weak-companion","seeded-small-places"],"headers":["Sun28.Abscissa.divisor_of_s  quartic","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"typed","claim":"For every residual prepared pair exhibit a multiplier q and a nonzero point of v²=b(u²−qd)(u²+3qd).","needs":["weak-seed-example","abscissa-split","ordered-residual"],"headers":["Sun28.Abscissa.QuarticCompanion"]},{"id":"finite-label-projection","title":"The polynomial from the finite covering criterion","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"The polynomial equivalence follows from the actual marked height input, suitable prime tuples, and rational solubility of one of the explicitly filtered quadrics at one seed per residual pair.","needs":["abscissa-split","period-mixed-window","abscissa-lift","pencil-actual-fibres","cm-small-class-discriminants"],"headers":["Sun28.Abscissa.strict_iff_label","Sun28.Abscissa.divisor_companion_iff","Sun28.Abscissa.one_sign_of_divisor_windows"]},{"id":"abscissa-benchmark","title":"Exact exclusion of multiplier 199951 on a residual pair","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"For the prepared benchmark, every nontrivial divisor candidate at q=199951 violates a local unit test. Any strict point at this seed would return the pair to an old quartic family.","needs":["finite-label-projection"],"headers":["Sun28.Abscissa.first_seed_empty","Sun28.Abscissa.first_seed_forces_old_family"]},{"id":"quartic-window-projection","title":"A polynomial theorem with a one-equation companion hypothesis","chapter":"Sun’s 28-witness construction","routes":["Sun’s 28 witnesses"],"state":"kernel","claim":"On squarefree proper twists the finite covering test is equivalent to solubility of one affine quartic for the same multiplier. The polynomial theorem consumes this point and the window and geometric hypotheses.","needs":["finite-label-projection"],"headers":["Sun28.Abscissa.strict_iff_quartic","Sun28.Abscissa.quartic_companion_i ","ZInQBlueprint.SelectedTwists.rank_of_bracket","ZInQBlueprint.SelectedTwists.frozen_of_height_bracket"]},{"id":"printed-bracket-theorem","title":"Glazer’s bounded theorem from the integer coefficient on page 760","chapter":"Bounded-polynomial comparisons","routes":["Bounded existence"],"state":"kernel","claim":"The three inputs are the intrinsic six-contact bound, evenness of the printed integer when the derivative vanishes, and the selected Gross–Zagier implication. The coefficient is transported in Lean in both directions.","needs":["selected-derivative","tyz-coefficient"],"headers":["ZInQBlueprint.SelectedTwists.PrintedBracketDerivative","ZInQBlueprint.SelectedTwists.printed_iff_bracket","ZInQBlueprint.SelectedTwists.frozen_of_printed_bracket"]},{"id":"original-theta-series","title":"All sixteen original theta constants","chapter":"Bounded-polynomial comparisons","routes":["Bounded existence"],"state":"kernel","claim":"The matrix series and the expanded binary-coordinate series agree at each characteristic and converge absolutely at every Siegel matrix.","needs":["squared-theta-height"],"headers":["ZInQBlueprint.OriginalTheta.characteristicEquiv","ZInQBlueprint.OriginalTheta.term_eq","ZInQBlueprint.OriginalTheta.thetaConst_eq","ZInQBlueprint.OriginalTheta.omega_isSiegel"]},{"id":"original-odd-theta","title":"Odd characteristics in the original normalization","chapter":"Bounded-polynomial comparisons","routes":["Bounded existence"],"state":"kernel","claim":"Each of the six original odd theta constants vanishes on Siegel space.","needs":["original-theta-series"],"headers":["ZInQBlueprint.OriginalTheta.thetaConst_odd"]},{"id":"original-thomae-representative","title":"One algebraic representative for the original theta nulls","chapter":"Bounded-polynomial comparisons","routes":["Bounded existence"],"state":"kernel","claim":"The ten equally scaled first Thomae identities on the sextic produce a single number-field representative for all sixteen original theta consta la the Fubini–Study height equals one eighth of the branch height plus an explicit bounded archimedean correction.","needs":["odd-model-isomorphism"],"headers":["ZInQBlueprint.SixMetric.pairChar_indices","ZInQBlueprint.SixMetric.theta_pair_with_infinity","ZInQBlueprint.SixMetric.exact_pazuki_height","ZInQBlueprint.SixMetric.branch_budget_of_printed_comparison","ZInQBlueprint.SixMetric.paper_intrinsic_pole"]},{"id":"discriminant-branch-transfer","title":"From the branch height to a rational invariant","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"On every unmarked fibre and nonzero twist the inequalities h(B)\u003ch(j)+175 and h(j)≤5h(B)+log(3779136) hold for every ordering of the roots.","needs":[],"headers":["ZInQBlueprint.JacobianHeight.branch_and_modular_height","ZInQBlueprint.JacobianHeight.canonical_of_modular_height"]},{"id":"discriminant-local","title":"Finite local factors of the rational sextic","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"On the signed sextic the Liu invariant J₁₀/J₂⁵ is j³/[12(j+1)]⁵. The explicit finite terms have finite support and the poles contribute exactly twice the modular height after division by the field degree.","needs":[],"headers":["ZInQBlueprint.JacobianHeight.paper_igusa_quotient","ZInQBlueprint.JacobianHeight.tame_order","ZInQBlueprint.JacobianHeight.finiteTerm_off_support","ZInQBlueprint.JacobianHeight.finiteTerm_at_pole"]},{"id":"discriminant-arch","title":"A uniform Petersson norm at every embedding","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The stated estimates on the reduced Siegel domain imply that the entire Petersson factor is less than 2⁴⁷.","needs":[],"headers":["ZInQBlueprint.JacobianHeight.StrengEstimates","ZInQBlueprint.JacobianHeight.petersson_bound","ZInQBlueprint.JacobianHeight.petersson_positive"]},{"id":"rational-picard-surface","title":"The rational Jacobian of the signed curve","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"Unpointed Picard descent gives a smooth proper geometrically connected commutative group scheme. Its curve has geometric genus two and its Jacobian has relative dimension two.","needs":[],"headers":["ZInQBlueprint.SixJacobian.jacobian","ZInQBlueprint.SixJacobian.isAbelian","ZInQBlueprint.SixJacobian.geometricGenus_two","ZInQBlueprint.SixJacobian.jacobian_dimension_two"]},{"id":"ordinary-integral-sextic","title":"Integral models at ordinary primes","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"For every p≥7 at which both F and G are units, the rational curve has a smooth proper integral model of relative dimension one with geometrically integral fibres.","needs":[],"headers":["ZInQBlueprint.OrdinaryModel.ordinary_curve_model","ZInQBlueprint.OrdinaryModel.relative_dimension"]},{"id":"discriminant-surface-application","title":"Geometric height theorems on the signed rational Jacobian","chapter":"Six-contact height","routes":["Bounded existence"],"state":"binding","claim":"Use the discriminant formula and the effective upper bound for the stable height of the same actual rational abelian surface.","needs":["rational-picard-surface","ordinary-integral-sextic","discriminant-local","discriminant-arch","discriminant-exact-sum","rational-jacobian-conductor","signed-sextic-automorphisms"],"headers":["ZInQBlueprint.JacobianHeight.EffectiveSurfaceHeight","ZInQBlueprint.JacobianHeight.JacobianPeriods","ZInQBlueprint.JacobianHeight.MarkedAction","ZInQBlueprint.JacobianHeight.RationalRM","ZInQBlueprint.JacobianHeight.GoodOutside"]},{"id":"discriminant-original-endpoint","title":"Glazer’s bounded polynomial from the Jacobian height formula","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The stated per-fibre height formulas, real multiplication and reduction on the constructed surface imply the uniform six-contact estimate and the original bounded theorem under the two printed rank implications.","needs":["discriminant-surface-application","discriminant-branch-transfer","two-printed-rank-results"],"headers":["ZInQBlueprint.JacobianHeight.rationalRM_of_marked","ZInQBlueprint.JacobianHeight.original_of_paper_fibre_heights","ZInQBlueprint.JacobianHeight.original_of_jacobian_geometry"]},{"id":"discriminant-exact-sum","title":"The finite discriminant as two rational logarithms","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"Write j=a/b in lowest terms with b>0. At every rational prime the normalized exponent is 3 max(0,v_p(j))+2 max(0,−v_p(j)). Over any number field K the finite sum divided by [K:ℚ] equals 3 log|a|+2 log b.","needs":["discriminant-local"],"headers":["ZInQBlueprint.JacobianHeight.ExactFinite.small_orders","ZInQBlueprint.JacobianHeight.ExactFinite.finiteTerm_all_primes","ZInQBlueprint.JacobianHeight.ExactFinite.finite_sum_eq"]},{"id":"ordinary-picard-good-reduction","title":"An abelian scheme at every ordinary prime","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"For p≥7 with F and G units, the degree-zero relative Picard group of the integral curve extends the actual rational Jacobian. An étale local section suffices.","needs":["ordinary-integral-sextic","rational-picard-surface"],"headers":["ZInQBlueprint.IntegralPicard.local_section_cover","ZInQBlueprint.IntegralPicard.exists_presentation","ZInQBlueprint.IntegralPicard.unpointed_baseChangeIso","ZInQBlueprint.IntegralPicard.paperJacobian_baseChangeIso","ZInQBlueprint.IntegralPicard.ordinary_goodReduction"]},{"id":"signed-conductor-places","title":"The conductor and the three local cases","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"Beyond five, the parity of the integer contact order detects exactly the variable part of the conductor outside S. All remaining primes of the public height bound are ordinary, even contacts or poles.","needs":["principal-reduction"],"headers":["ZInQBlueprint.ReductionPlaces.contact_order","ZInQBlueprint.ReductionPlaces.conductor_iff","ZInQBlueprint.ReductionPlaces.localCases_iff_even","ZInQBlueprint.ReductionPlaces.outside_conductor"]},{"id":"branch-four-division","title":"One unramified extension for all fourth-division radicals","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The five transformed roots on each collision chart have even pairwise differences in valuation. One finite étale Witt extension of rank four over the p-adic integers contains all the square roots.","needs":["signed-conductor-places","principal-reduction"],"headers":["SixContactFour.oddRoot_sub","SixContactFour.even_contact_differences","SixContactFour.pole_differences","ZInQBlueprint.WittSquareClasses.simultaneous","ZInQBlueprint.LocalCurveReduction.radical_extension","ZInQBlueprint.LocalCurveReduction.outside_conductor"]},{"id":"rational-jacobian-conductor","title":"The conductor of the signed rational Jacobian","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"Outside the prescribed set, the actual two-dimensional rational Picard variety has good reduction, assuming DDMM Theorem 10.3(5) for arbitrary sextics with two triples. The original endpoint uses this result.","needs":["signed-conductor-places","ordinary-picard-good-reduction","principal-reduction"],"headers":["ZInQBlueprint.LocalJacobians.TwoTripleGoodReduction","ZInQBlueprint.LocalJacobians.chart_geometry","ZInQBlueprint.LocalJacobians.good_chart","ZInQBlueprint.JacobianConductor.good_outside","ZInQBlueprint.JacobianConductor.original_of_marking_and_periods"]},{"id":"signed-sextic-automorphisms","title":"The two signs on a rational fibre","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"On every unmarked rational fibre and nonzero twist the binary-sextic stabilizer is sca
