of_scalar_centralizer","ZInQBlueprint.LevelThree.IntegralOrder.fullActionOfScalarCenter","ZInQBlueprint.LevelThree.IntegralOrder.fullActionOfScalarCenter_apply"]},{"id":"signed-abel-point-separation","title":"Point separation and regular differentials","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The signed Abel map separates all geometric points. At every geometric place the dimensions of the canonical system before and after subtracting the place are two and one. A regular differential has nonzero evaluation there.","needs":["signed-abel-map"],"headers":["ZInQBlueprint.SixAbelMap.abel_injective","ZInQBlueprint.SixAbelMap.paper_canonical_pencil","ZInQBlueprint.SixAbelMap.paper_regular_evaluation","ZInQBlueprint.SixAbelMap.abel_closed_of_formallyUnramified"]},{"id":"signed-theta-restriction","title":"Restriction to a translated closed Abel curve","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"For any specified divisor presentation whose morphism is a closed immersion, an automorphism preserving its translated Abel images restricts after translation to an automorphism of the actual scheme curve. Subtraction cancels the translation.","needs":["signed-abel-divisors","signed-weighted-points"],"headers":["ZInQBlueprint.SixThetaRestriction.restrict_theta","ZInQBlueprint.SixThetaRestriction.restrict_presentation","ZInQBlueprint.SixThetaRestriction.polarizedTorelli_of_presentation"]},{"id":"signed-open-coordinates","title":"Comparison on the finite chart","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"On the signed sextic one coordinate lift agreeing with a scheme automorphism on a nonempty open agrees on every geometric point, including infinity. The affine formulas on the finite chart are sufficient.","needs":["signed-weighted-points","signed-sextic-automorphisms"],"headers":["ZInQBlueprint.SixAbelMap.sign_and_action_of_open","ZInQBlueprint.SixAbelMap.curve_lifts_iff_open","ZInQBlueprint.SixAbelMap.weighted_action_of_voight"]},{"id":"signed-poincare-curve","title":"The Abel curve with its Poincaré normalization","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The actual signed Jacobian has a specified morphism representing the point divisor P−b on field-valued points under canonical pointed Picard comparison. The same morphism has the full divisor comparison, is injective on geometric points and is a closed immersion if it is formally unramified.","needs":["signed-principal-fibres","signed-abel-map","signed-abel-point-separation"],"headers":["ZInQBlueprint.SixAbelMap.exists_representing_abel","ZInQBlueprint.SixAbelMap.rigid_classifies","ZInQBlueprint.SixAbelMap.rigidDivisors","ZInQBlueprint.SixAbelMap.rigid_point_injective","ZInQBlueprint.SixAbelMap.rigid_closed_of_unramified"]},{"id":"signed-determinant-theta","title":"The determinant section and the Abel image","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"On the geometric fibre of the signed rational Jacobian the pointed determinant has a nonzero section. Its geometric zeros are exactly the degree-one translates [P−b]. The radical of the zero ideal is the ideal of the scheme-theoretic Abel image. Reducedness of the zero scheme would give equality of the full ideals.","needs":["signed-poincare-curve"],"headers":["ZInQBlueprint.CanonicalTheta.signedThetaLine_determinant","ZInQBlueprint.CanonicalTheta.signedThetaSection_ne_zero","ZInQBlueprint.CanonicalTheta.signedThetaSection_zeros","ZInQBlueprint.CanonicalTheta.signedThetaSection_reduced_ideal","ZInQBlueprint.CanonicalTheta.signedThetaSection_ideal_of_reduced"]},{"id":"signed-theta-linear-system","title":"Zero ideals in a one-dimensional linear system","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"Nonzero sections of a line bundle with a one-dimensional space of global sections cut out the same ideal. This also gives equality of linearly equivalent effective Cartier divisors and the vanishing equivalence for the two group pullbacks.","needs":[],"headers":["ZInQBlueprint.ThetaLinearSystem.zeroScheme_eq","ZInQBlueprint.ThetaLinearSystem.effective_eq_of_linearly_equivalent","ZInQBlueprint.ThetaLinearSystem.group_vanishes_iff"]},{"id":"signed-polarized-comparison","title":"From a polarization class to Abel translates","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"A marked isomorphism preserving the conjugate class and a Galois-invariant principal determinant class of dimension one give a correction preserving all Abel translates. Both radical signs of the marked quotient have the stated rational coordinates.","needs":["signed-determinant-theta","signed-theta-linear-system","signed-printed-order"],"headers":["ZInQBlueprint.ThetaClass.sameClass_pull_comparison","ZInQBlueprint.ThetaClass.preserves_of_polarization","ZInQBlueprint.ThetaClass.classMarking_of_labelled_field","ZInQBlueprint.ThetaClass.marked_quotient_coordinate","ZInQBlueprint.ThetaClass.lift_printed_parameter"]},{"id":"signed-gaussian-period","title":"A Gaussian estimate and the denominator of the moduli parameter","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"For any reduced genus-two period the ten even theta series satisfy an explicit Petersson bound. For the signed family the normalized stable-height identity and the denominator-square divisibility alone imply h(j)\u003c30h_F+150. Fixed two-torsion pair labels determine all six Weierstrass points.","needs":[],"headers":["ZInQBlueprint.PeriodGaussian.petersson_gaussian","ZInQBlueprint.PeriodGaussian.log_allowance","ZInQBlueprint.PeriodGaussian.denominator_ideal_dvd","ZInQBlueprint.PeriodGaussian.denominator_norm_lower","ZInQBlueprint.PeriodGaussian.height_of_stable_discriminant","ZInQBlueprint.PeriodGaussian.fixes_six_of_torsion"]},{"id":"signed-igusa-ideal-orders","title":"The Igusa valuation at every denominator prime ideal","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"At each prime of any number field above a pole of j the actual Igusa quotient has twice the order of the denominator. The good-characteristic local formula therefore gives the exact order of the minimal discriminant there, including at ramified places.","needs":["signed-gaussian-period"],"headers":["ZInQBlueprint.ThetaClass.igusa_valuation_at_denominator","ZInQBlueprint.ThetaClass.orders_of_local_igusa","ZInQBlueprint.ThetaClass.pole_period_of_igusa"]},{"id":"signed-abel-differences","title":"Every Jacobian point is one Abel difference","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"For a smooth signed sextic every geometric Jacobian point has the form [Q−P]. Pullback along the difference map injects global sections of the determinant into those of its pullback.","needs":["signed-abel-divisors","signed-determinant-theta"],"headers":["ZInQBlueprint.DeterminantSections.signed_single_difference","ZInQBlueprint.DeterminantSections.differenceMap_surjective","ZInQBlueprint.DeterminantSections.signed_rank_one"]},{"id":"signed-prime-form","title":"The independent two-point calculation of the section dimension","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The actual sheaves O(b) and O(K−b) each have one section up to scalar. The signed determinant then has one section up to scalar if the two-point isomorphism and the two specified maps on the curve square have their classical properties.","needs":["signed-abel-differences"],"headers":["ZInQBlueprint.DeterminantSections.canonicalPartner_exists","ZInQBlueprint.DeterminantSections.pointLine_rank","ZInQBlueprint.DeterminantSections.PrimeFormGeometry","ZInQBlueprint.DeterminantSections.signed_rank_of_prime_form"]},{"id":"signed-poincare-evaluations","title":"The image of the determinant homomorphism","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"For the normalized Poincaré evaluation U_P and translation T_x(y)=y+x, the determinant homomorphism sends [P−b] to −[U_P]. Its image is exactly the subgroup generated by those evaluations, and all its elements are algebraically trivial.","needs":["signed-determinant-theta","signed-abel-divisors"],"headers":["ZInQBlueprint.DeterminantAutoduality.polarization_at_abel","ZInQBlueprint.DeterminantAutoduality.range_eq_poincare","ZInQBlueprint.DeterminantAutoduality.signed_image_in_picardZero","ZInQBlueprint.DeterminantAutoduality.signed_principal_iff_picardZero"]},{"id":"signed-abel-stabilizer","title":"The stabilizer of the genus-two Abel curve","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"If one translate of the geometric Abel curve is contained in it, the translating point is zero. Consequently a one-dimensional theta section space already forces injectivity of the determinant homomorphism.","needs":["signed-determinant-theta","signed-abel-divisors"],"headers":["ZInQBlueprint.ThetaClass.signed_abel_stabilizer_zero","ZInQBlueprint.ThetaClass.signed_polarization_injective"]},{"id":"signed-injective-polarization","title":"Injectivity from restriction to the Abel curve","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The restriction of U_P along the actual rigidified Abel morphism is O(P−b). Every Jacobian point is a difference, so two equal evaluations give equal Abel points and the determinant homomorphism is injective.","needs":["signed-poincare-evaluations","signed-abel-differences"],"headers":["ZInQBlueprint.DeterminantAutoduality.signed_abel_pullback_evaluation","ZInQBlueprint.DeterminantAutoduality.signed_eq_abel_of_evaluations","ZInQBlueprint.DeterminantAutoduality.signedPolarization_injective"]},{"id":"signed-moving-base","title":"The coefficient action on the normalized Abel map","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"For every geometric base point the coefficient action sends [P−b] to [σP−σb]. The unpointed, pointed and scalar-extended Picard classifications give this law for the actual rigidified Abel morphism.","needs":["signed-poincare-curve"],"headers":["ZInQBlueprint.AbelGalois.rigid_point_class","ZInQBlueprint.AbelGalois.rigid_translated_image","ZInQBlueprint.AbelGalois.signed_galois","ZInQBlueprint.AbelGalois.baseChange_difference"]},{"id":"signed-cartier-descent","title":"Galois descent with arbitrary theta multiplicity","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The signed theta section has an invertible zero ideal with irreducible support. Its Galois conjugate and one translate have the same support. The one-component factorization of effective Cartier divisors on regular noetherian schemes gives equality of their ideals and rationality of the class.","needs":["signed-moving-base","signed-determinant-theta"],"headers":["ZInQBlueprint.ThetaClass.signedThetaSection_cartier","ZInQBlueprint.ThetaClass.signedTheta_translate","ZInQBlueprint.ThetaClass.signed_theta_support_irreducible","ZInQBlueprint.ThetaClass.signed_deck_abel_support","ZInQBlueprint.ThetaClass.comap_eq_of_power_and_support","ZInQBlueprint.ThetaClass.rational_of_prime_factorization","ZInQBlueprint.ThetaClass.CartierPrimeFactorization"]},{"id":"signed-effective-polarization","title":"A principal polarization from a trivial geometric kernel","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"For the actual effective signed determinant, injectivity makes the geometric kernel a singleton. The general image and degree formulas for effective invertible sheaves in characteristic zero give surjectivity onto Picard-zero and h⁰=1. The signed determinant then satisfies all three required polarization properties.","needs":["signed-injective-polarization","signed-cartier-descent"],"headers":["ZInQBlueprint.ThetaClass.EffectivePolarizationImage","ZInQBlueprint.ThetaClass.EffectivePolarizationDegree","ZInQBlueprint.ThetaClass.one_and_principal_of_injective","ZInQBlueprint.ThetaClass.signed_determinant_of_standard_facts"]},{"id":"signed-determinant-specialization","title":"The classical principal polarization on the signed determinant","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The signed determinant realizes all three properties used in the marked comparison, conditional on Milne’s general effective-polarization results and the one-component Cartier divisor factorization. The complete deduction for this family is kernel-checked.","needs":["signed-effective-polarization"],"headers":["ZInQBlueprint.ThetaClass.DeterminantPolarization","ZInQBlueprint.ThetaClass.signed_determinant_of_standard_facts"]},{"id":"signed-discriminant-weight","title":"Integral Weierstrass equations at a denominator prime","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"For each integral equation at w dividing the denominator of j, the quadratic invariant is integral and its fifth power times the absolute Igusa ratio is the discriminant. This gives order at least twice the order of the denominator, with ramification included.","needs":["signed-igusa-ideal-orders"],"headers":["ZInQBlueprint.MinimalDiscriminant.IntegralEquation.quadratic_integral","ZInQBlueprint.MinimalDiscriminant.IntegralEquation.discriminant_eq","ZInQBlueprint.MinimalDiscriminant.IntegralEquation.valuation_le","ZInQBlueprint.MinimalDiscriminant.denominator_orders","ZInQBlueprint.MinimalDiscriminant.denominator_dvd"]},{"id":"signed-integral-minimum","title":"A global ideal from locally attained minima","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"Every completion admits an integral reference equation with the same nonzero integer discriminant. The minima of attainable nonnegative orders determine a nonzero ideal divisible by the squared denominator over every number field.","needs":["signed-discriminant-weight"],"headers":["ZInQBlueprint.MinimalDiscriminant.localOrder_attained","ZInQBlueprint.MinimalDiscriminant.localOrder_le","ZInQBlueprint.MinimalDiscriminant.exists_minimal_ideal","ZInQBlueprint.MinimalDiscriminant.minimalIdeal_spec","ZInQBlueprint.MinimalDiscriminant.minimalIdeal_represented","ZInQBlueprint.MinimalDiscriminant.signed_minimal_divisibility"]},{"id":"signed-rational-cm-exclusion","title":"Exclusion of every rational CM parameter","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The off-contact rational parameter satisfies 0\u003ct\u003c1, with t/3 and 1−t rational squares. None of the 27 entries in Errthum’s rational CM table satisfies these conditions.","needs":["signed-polarized-comparison"],"headers":["ZInQBlueprint.QuaternionLift.tests_at_slope","ZInQBlueprint.QuaternionLift.first_filter","ZInQBlueprint.QuaternionLift.table_filter","ZInQBlueprint.QuaternionLift.avoids_cm_table"]},{"id":"signed-shimura-labelling","title":"A single polarized representative gives every labelled lift","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"A Galois-equivariant class map invariant under w₃, and one compatible polarized representative of its value on the printed Jacobian, imply the labelled field of moduli for every sign of each radical.","needs":["signed-rational-cm-exclusion","signed-polarized-comparison"],"headers":["ZInQBlueprint.QuaternionLift.PolarizedRealization","ZInQBlueprint.QuaternionLift.PrintedComparison","ZInQBlueprint.QuaternionLift.labelled_of_realization","ZInQBlueprint.QuaternionLift.printedField_of_shimura","ZInQBlueprint.QuaternionLift.all_printed_lifts"]},{"id":"signed-shimura-representative","title":"The ordinary Shimura representative on the printed Jacobian","chapter":"Six-contact height","routes":["Bounded existence"],"state":"binding","claim":"At one rational slope realize the surface with its integral action and Rosati form. Its polarized class must give the actual signed Jacobian once the real generator is forgotten.","needs":["signed-rational-cm-exclusion"],"headers":["ZInQBlueprint.QuaternionLift.ShimuraClassMap","ZInQBlueprint.QuaternionLift.PrintedComparison","ZInQBlueprint.QuaternionLift.UnpolarizedPrintedComparison","ZInQBlueprint.QuaternionLift.UniqueD6Polarization","ZInQBlueprint.ShimuraAtlas.unpolarized_of_mestre","ZInQBlueprint.ShimuraAtlas.unpolarized_of_rational_mestre","ZInQBlueprint.ShimuraAtlas.ordinary_representative","ZInQBlueprint.ShimuraAtlas.PolarizedIgusaClassification","ZInQBlueprint.ShimuraAtlas.RationalPolarizedForgetful","ZInQBlueprint.ShimuraAtlas.RationalRosatiClasses"]},{"id":"signed-height-splitting-field","title":"One number field for 12-torsion and the six branch points","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"On every smooth signed fibre there is one number field splitting all geometric 12-torsion and all six branch points. A rational branch root gives a monic quintic with an explicit coordinate change.","needs":["signed-weighted-points","rational-picard-surface"],"headers":["ZInQBlueprint.TorsionHeight.signed_height_field","ZInQBlueprint.TorsionHeight.six_sections_when_split"]},{"id":"signed-global-good-field","title":"Good reduction and a proper quintic on the same field","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"From the printed quaternionic action, potential good reduction and the Serre–Tate criterion, the Jacobian has good reduction at every finite place over a single number field. The explicit split monic quintic completes to the literal signed curve over that field.","needs":["signed-height-splitting-field","signed-shimura-labelling"],"headers":["ZInQBlueprint.TorsionHeight.signed_stable_model","ZInQBlueprint.TorsionHeight.signed_quintic_completion","ZInQBlueprint.TorsionHeight.signed_height_field_good","ZInQBlueprint.TorsionHeight.good_everywhere_of_full_twelve"]},{"id":"signed-height-embeddings","title":"The Petersson bound summed over all embeddings","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The normalized stable height and a represented ideal obey the lower height bound once the Petersson factor is bounded separately at each complex embedding. Every embedding may use its own period.","needs":["signed-gaussian-period","signed-discriminant-weight"],"headers":["ZInQBlueprint.ArchimedeanHeight.embedding_sum_upper","ZInQBlueprint.ArchimedeanHeight.floor_of_embeddings","ZInQBlueprint.ArchimedeanHeight.height_of_ideal_floor"]},{"id":"signed-global-stable-height","title":"The normalized global genus-two height formula","chapter":"Six-contact height","routes":["Bounded existence"],"state":"binding","claim":"The general literature input specifies the stable height in von Känel’s metric, local minimizing equations for one nonzero ideal, and a reduced period for each embedding in Habegger–Pazuki’s Corollary 4.6.","needs":["signed-global-good-field","signed-height-embeddings"],"headers":["ZInQBlueprint.MinimalDiscriminant.GlobalHeightFormula"]},{"id":"signed-rosati-units","title":"The two polarized units of the discriminant-six order","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The positive integral quadratic form 4 Re(q†q) takes the value 4 only at q=1 and q=−1. One entry of the primitive Riemann form gives the same test. The calculation is uniform over the literal order.","needs":["signed-printed-order"],"headers":["ZInQBlueprint.RosatiSigns.trace_form","ZInQBlueprint.RosatiSigns.integral_minimum","ZInQBlueprint.RosatiSigns.polarized_order_iff","ZInQBlueprint.RosatiSigns.normalized_pair_iff"]},{"id":"signed-central-descent","title":"The quaternionic Galois correction is scalar","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"A comparison respecting the polarization class carries its polarized units to those of the signed Jacobian. Every correction to the labelled Galois isomorphism is scalar and therefore cancels. This gives rational real multiplication directly. The bare group-isomorphism version uses two uniform facts about principally polarized quaternionic surfaces.","needs":["signed-rosati-units","signed-shimura-labelling","signed-cartier-descent"],"headers":["ZInQBlueprint.RosatiSigns.marked_of_class_signs","ZInQBlueprint.RosatiSigns.marked_of_shimura_rational","ZInQBlueprint.RosatiSigns.marked_of_shimura","ZInQBlueprint.RosatiSigns.full_order_of_unpolarized","ZInQBlueprint.RosatiSigns.marked_of_unpolarized"]},{"id":"signed-primitive-polarization","title":"Principal polarizations on a full-order quaternionic surface","chapter":"Six-contact height","routes":["Bounded existence"],"state":"binding","claim":"The unpolarized comparison uses existence of a compatible primitive principal line over the algebraic closure and uniqueness up to a group automorphism. Voight, Rotger, the invariance of the Néron–Severi group under algebraically closed extension, and abelian Riemann–Roch give the literature route.","needs":["signed-rosati-units"],"headers":["ZInQBlueprint.RosatiSigns.PrimitivePrincipalExists"]},{"id":"signed-conic-quotient","title":"The rational quotient of the Shimura conic","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The invariant chart has coordinate t=3z/y. On every off-contact rational fibre its points lie on two rational slopes, and one of the two suffices for the comparison. The determinant and CM table exclude precisely the zero slope.","needs":["signed-rational-cm-exclusion"],"headers":["ZInQBlueprint.ShimuraAtlas.fixed_polynomials","ZInQBlueprint.ShimuraAtlas.quotient_on_point","ZInQBlueprint.ShimuraAtlas.shimuraClassMap","ZInQBlueprint.ShimuraAtlas.class_on_conic","ZInQBlueprint.ShimuraAtlas.gaussianPoint","ZInQBlueprint.ShimuraAtlas.gaussianPoint_exhausts","ZInQBlueprint.ShimuraAtlas.gaussianPoint_fibre","ZInQBlueprint.ShimuraAtlas.gaussianPoint_quotient","ZInQBlueprint.ShimuraAtlas.gaussian_fibre_galois","ZInQBlueprint.ShimuraAtlas.otherGaussianSheet_quotient","ZInQBlueprint.ShimuraAtlas.j_quotient","ZInQBlueprint.ShimuraAtlas.gaussian_rational_equation","ZInQBlueprint.ShimuraAtlas.rational_fibre_iff","ZInQBlueprint.QuaternionLift.mestre_open_iff_slope_ne_zero","ZInQBlueprint.QuaternionLift.outsideCM_iff_slope_ne_zero","ZInQBlueprint.QuaternionLift.rational_slope_table"]},{"id":"signed-modular-equation","title":"The two sextics of Baba and Granath","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The homogeneous sextic of Theorem 3.14, with the compatible sign, becomes the normalized modular sextic of Corollary 3.15 under an explicit scaling of the abscissa and ordinate. The affine isomorphism extends uniquely over the smooth proper completions. The five weighted Igusa invariants of the signed sextic equal the arithmetic tuple of Baba and Granath at J(u), with an explicit nonzero rational scale.","needs":["signed-conic-quotient"],"headers":["ZInQBlueprint.ShimuraAtlas.period_binary","ZInQBlueprint.ShimuraAtlas.periods_to_printed","ZInQBlueprint.ShimuraAtlas.compatible_radicals","ZInQBlueprint.ShimuraAtlas.modular_regular","ZInQBlueprint.ShimuraAtlas.modularChartIso","ZInQBlueprint.ShimuraAtlas.modular_completion","ZInQBlueprint.SexticInvariants.igusaI6_family","ZInQBlueprint.SexticInvariants.igusa_tuple_family","ZInQBlueprint.SexticInvariants.signed_igusa_tuple"]},{"id":"signed-modular-jacobian","title":"The Jacobian of the normalized modular sextic","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The modular, printed and signed curves have isomorphic Jacobians. Pullback of the smooth signed family identifies the literal modular-form sextic over the complex numbers with the correct Jacobian, even for transcendental common scale.","needs":["signed-modular-equation","signed-conic-quotient"],"headers":["ZInQBlueprint.ShimuraAtlas.modularCurveIso","ZInQBlueprint.ShimuraAtlas.signedToModular","ZInQBlueprint.ShimuraAtlas.signedModularJacobian","ZInQBlueprint.ShimuraAtlas.modularPrintedJacobian","ZInQBlueprint.ShimuraAtlas.descendIso","ZInQBlueprint.ShimuraAtlas.endBaseEquiv","ZInQBlueprint.ShimuraAtlas.order_extends","ZInQBlueprint.ShimuraAtlas.unpolarized_of_modular","ZInQBlueprint.ShimuraAtlas.printedField_of_modular","ZInQBlueprint.ShimuraAtlas.raw_equation","ZInQBlueprint.ShimuraAtlas.modular_of_canonical","ZInQBlueprint.ShimuraAtlas.raw_polynomial_equation","ZInQBlueprint.ShimuraAtlas.raw_models","ZInQBlueprint.ShimuraAtlas.raw_jacobian","ZInQBlueprint.ShimuraAtlas.raw_signed_curve","ZInQBlueprint.ShimuraAtlas.canonicalPeriods_of_raw"]},{"id":"signed-cm-normalization","title":"The exact modular coordinate at discriminant −19","chapter":"Six-contact height","routes":["Bounded existence"],"state":"kernel","claim":"The modular coordinate normalized at the three elliptic points is Errthum’s t₆. The arithmetic value 81/64 and the signed t₆-value −2187/1024 at discriminant −19 eliminate the reciprocal in Baba–Granath’s two alternatives. Under the published coordinate and CM data the global identity follows without an analytic approximation. Two integral lemmas give the effect of doubling through the complementary elliptic isogenies and recovery of the whole central order from saturation at two.","needs":[],"headers":["ZInQBlueprint.ShimuraAtlas.cm19_in_absolute_table","ZInQBlueprint.ShimuraAtlas.normalized_eq_of_cm19","ZInQBlueprint.ShimuraAtlas.twice_endomorphism","ZInQBlueprint.ShimuraAtlas.full_of_twice_and_at_two"]},{"id":"signed-modular-realization","title":"The geometric interpretation of the ordinary labelled Shimura quotient","chapter":"Six-contact height","routes":["Bounded existence"],"state":"binding","claim":"Inst <script>
"use strict";
const data=JSON.parse(document.getElementById("data").textContent), rows=data.packages, index=new Map(rows.map(r=>[r.id,r]));
const states={kernel:"Kernel checked",public:"Upstream proof",typed:"Header only",binding:"Open application",missing:"Needs a header"};
const dependents=new Map(rows.map(r=>[r.id,[]]));for(const r of rows)for(const n of r.needs)dependents.get(n).push(r.id);
const el=id=>document.getElementById(id), make=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
function options(id,items){for(const [k,label] of items){const o=make("option",label);o.value=k;el(id).append(o);}}
options("route",data.routes.map(x=>[x,x]));options("state",Object.entries(states));
const haystack=new Map(rows.map(r=>[r.id,[r.title,r.claim,r.chapter,...r.headers].join(" ").toLowerCase()]));
function matches(){const q=el("query").value.trim().toLowerCase();return rows.filter(r=>(!el("route").value||r.routes.includes(el("route").value))&&(!el("state").value||r.state===el("state").value)&&haystack.get(r.id).includes(q));}
let current=null;
function select(r,fromGraph=false){current=r;history.replaceState(null,"","#"+r.id);
 if(fromGraph&&!matches().some(x=>x.id===r.id)){el("query").value="";el("route").value="";el("state").value="";renderList();}
 for(const b of el("list").children)b.setAttribute("aria-current",b.dataset.id===r.id?"true":"false");
 const panel=el("detail");panel.replaceChildren(make("div",r.chapter,"detailmeta"),make("h2",r.title),make("p",states[r.state]+" · "+r.routes.join(" · "),"status"),make("p",r.claim));
 panel.append(make("div","Dependencies of this statement","focus"));const neighbors=make("div",undefined,"neighbors");panel.append(neighbors);
 for(const [title,ids] of [["Uses",r.needs],["Used by",dependents.get(r.id)]]){const box=make("section");neighbors.append(box);box.append(make("h3",title+" ("+ids.length+")"));if(!ids.length)box.append(make("small","None recorded."));for(const id of ids){const n=index.get(id),b=make("button",n.title);b.append(make("small",states[n.state]));b.onclick=()=>select(n,true);box.append(b);}}
 if(r.headers.length){const details=make("details"),sum=make("summary","Lean declarations ("+r.headers.length+")"),ul=make("ul");details.append(sum,ul);panel.append(details);for(const h of r.headers){const li=make("li"),code=make("code",h);if(data.declarations[h]){const a=make("a");a.href="https://github.com/nasqret/z-in-q-lean/blob/main/"+data.declarations[h];a.append(code);li.append(a);}else li.append(code);ul.append(li);}}
}
function renderList(preferred){const found=matches(),list=el("list");list.replaceChildren();el("count").textContent=found.length+" of "+rows.length+" statements";for(const r of found){const b=make("button",r.title);b.dataset.id=r.id;b.append(make("small",states[r.state]));b.onclick=()=>select(r);list.append(b);}
 if(!found.length){current=null;el("detail").replaceChildren(make("h2","No matching statement"),make("p","Change the search or select another construction."));return;}
 select(found.find(r=>r.id===preferred)||found.find(r=>current&&r.id===current.id)||found[0]);}
for(const name of ["query","route","state"])el(name).addEventListener("input",()=>renderList());
renderList(location.hash.slice(1)||"signed-jacobian-original-endpoint");
</script></body></html>
